<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대전외고 심화영어 단어 퀴즈 (2일)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #38bdf8;
    --accent2: #f472b6;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --border: #1e2d40;
    --correct: #4ade80;
    --wrong: #f87171;
    --day1: #38bdf8;
    --day2: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(56,189,248,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 20px; }

  header { text-align: center; padding: 36px 20px 24px; }
  .school-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid rgba(56,189,248,0.4);
    padding: 4px 14px;
    margin-bottom: 12px;
    text-transform: uppercase;
    border-radius: 2px;
  }
  header h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 900; margin-bottom: 6px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--text-dim); font-size: 12px; }

  /* Day tabs */
  .day-tabs { display: flex; gap: 12px; margin: 20px 0; }
  .day-tab {
    flex: 1; padding: 18px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .day-tab::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--dc, var(--accent));
    transform: scaleX(0);
    transition: transform 0.25s;
  }
  .day-tab.active::after { transform: scaleX(1); }
  .day-tab.active { background: var(--surface2); border-color: var(--dc, var(--accent)); }
  .day-tab[data-day="1"] { --dc: var(--day1); }
  .day-tab[data-day="2"] { --dc: var(--day2); }
  .dn { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--dc, var(--accent)); letter-spacing: 2px; margin-bottom: 5px; }
  .dt { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
  .ds { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .dc { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--dc, var(--accent)); }

  /* Progress */
  .progress-bar-wrap { background: var(--surface); border-radius: 4px; height: 5px; margin-bottom: 18px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s; }

  /* Scores */
  .score-strip { display: flex; gap: 10px; margin-bottom: 18px; }
  .score-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; text-align: center; }
  .score-card .num { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; }
  .score-card .lbl { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .score-card.c .num { color: var(--correct); }
  .score-card.w .num { color: var(--wrong); }
  .score-card.r .num { color: var(--accent); }

  /* Mode/Dir toggles */
  .toggle-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .toggle-group { flex: 1; display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tog-btn { flex: 1; padding: 9px 6px; border: none; background: transparent; color: var(--text-dim); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .tog-btn.active { background: var(--surface2); color: var(--text); font-weight: 700; }

  /* Quiz card */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px 28px;
    margin-bottom: 14px;
    min-height: 150px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative;
    transition: border-color 0.25s, background 0.25s;
  }
  .quiz-card.cf { border-color: var(--correct); background: rgba(74,222,128,0.05); }
  .quiz-card.wf { border-color: var(--wrong); background: rgba(248,113,113,0.05); }
  .q-num { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); position: absolute; top: 12px; right: 16px; }
  .q-ch { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
  .q-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; }
  .q-word { font-size: clamp(20px, 4.5vw, 36px); font-weight: 900; line-height: 1.3; }

  /* Options */
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
  .opt-btn {
    padding: 14px 11px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 10px; color: var(--text); font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; cursor: pointer; transition: all 0.15s; text-align: left; line-height: 1.4;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); }
  .opt-btn.ca { border-color: var(--correct) !important; background: rgba(74,222,128,0.1) !important; color: var(--correct); }
  .opt-btn.wa { border-color: var(--wrong) !important; background: rgba(248,113,113,0.1) !important; color: var(--wrong); }
  .opt-btn:disabled { cursor: default; }

  /* Input */
  .input-wrap { display: flex; gap: 9px; margin-bottom: 14px; }
  .ans-input {
    flex: 1; padding: 13px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px;
    outline: none; transition: border-color 0.2s;
  }
  .ans-input:focus { border-color: var(--accent); }
  .ans-input.ci { border-color: var(--correct); background: rgba(74,222,128,0.07); }
  .ans-input.wi { border-color: var(--wrong); background: rgba(248,113,113,0.07); }
  .submit-btn, .next-btn {
    padding: 13px 22px; border: none; border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .submit-btn { background: var(--accent); color: #0a0f1e; }
  .submit-btn:hover { filter: brightness(1.1); }
  .next-btn { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-bottom: 14px; }
  .next-btn:hover { border-color: var(--accent); }

  /* Feedback */
  .feedback { text-align: center; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-bottom: 11px; display: none; }
  .feedback.show { display: block; }
  .feedback.fc { background: rgba(74,222,128,0.08); color: var(--correct); border: 1px solid rgba(74,222,128,0.25); }
  .feedback.fw { background: rgba(248,113,113,0.08); color: var(--wrong); border: 1px solid rgba(248,113,113,0.25); }

  /* Result */
  .result-screen { display: none; text-align: center; padding: 40px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; }
  .result-screen.show { display: block; }
  .result-emoji { font-size: 52px; margin-bottom: 14px; }
  .result-score { font-size: 46px; font-weight: 900; font-family: 'Space Mono', monospace; margin-bottom: 8px; color: var(--accent); }
  .result-msg { color: var(--text-dim); margin-bottom: 22px; font-size: 13px; }
  .restart-btn { padding: 13px 28px; background: var(--accent); border: none; border-radius: 10px; color: #0a0f1e; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin: 5px; }
  .restart-btn:hover { filter: brightness(1.1); }
  .restart-btn.sec { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .restart-btn.sec:hover { border-color: var(--accent); }
  .wrong-list { margin-top: 22px; text-align: left; }
  .wrong-list h3 { font-size: 12px; color: var(--wrong); margin-bottom: 10px; }
  .wrong-item { display: flex; justify-content: space-between; padding: 8px 11px; background: var(--surface2); border-radius: 6px; margin-bottom: 5px; font-size: 12px; gap: 10px; }
  .wi-en { font-weight: 700; color: var(--text); }
  .wi-kr { color: var(--text-dim); text-align: right; }

  @media(max-width:540px){
    .options-grid { grid-template-columns: 1fr; }
    .toggle-row { flex-direction: column; }
  }
</style>
</head>

      <button class="submit-btn" onclick="submitInput()">확인</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()" style="display:none">다음 문제 →</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="rEmoji">🎉</div>
    <div class="result-score" id="rScore">0/0</div>
    <div class="result-msg" id="rMsg"></div>
    <button class="restart-btn" onclick="restartDay()">🔄 다시 풀기</button>
    <button class="restart-btn sec" onclick="reviewWrong()">✗ 틀린 것만 다시</button>
    <div class="wrong-list" id="wrongList"></div>
  </div>
</div>

let curDay = 'day1', mode = 'choice', dir = 'mixed';
let questions = [], qIdx = 0, corr = 0, wrng = 0, wrongWords = [], answered = false;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function initDay(day) {
  curDay = day;
  questions = shuffle(VOCAB[day].words);
  qIdx = corr = wrng = 0; wrongWords = [];
  updateScores(); updateProgress();
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  renderQ();
  document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.day-tab[data-day="${day.replace('day','')}"]`)?.classList.add('active');
}

function setMode(m) {
  mode = m;
  ['C','I'].forEach(x => document.getElementById('m'+x).classList.toggle('active', (x==='C'&&m==='choice')||(x==='I'&&m==='input')));
  document.getElementById('optGrid').style.display = m === 'choice' ? '' : 'none';
  document.getElementById('inputWrap').style.display = m === 'input' ? '' : 'none';
  initDay(curDay);
}

function setDir(d) {
  dir = d;
  ['Mix','EK','KE'].forEach(x => document.getElementById('d'+x).classList.toggle('active', d === x.toLowerCase()));
  initDay(curDay);
}

function getShowEn() {
  if (dir === 'ek') return true;
  if (dir === 'ke') return false;
  return Math.random() > 0.4;
}

function renderQ() {
  answered = false;
  document.getElementById('feedback').classList.remove('show','fc','fw');
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('quizCard').classList.remove('cf','wf');
  if (qIdx >= questions.length) { showResult(); return; }
  const q = questions[qIdx];
  const showEn = getShowEn();
  const qWord = showEn ? q.en : q.kr;
  const ans = showEn ? q.kr : q.en;
  document.getElementById('qNum').textContent = `${qIdx+1} / ${questions.length}`;
  document.getElementById('qCh').textContent = `Ch ${q.ch}`;
  document.getElementById('qLabel').textContent = showEn ? '영어 → 한국어' : '한국어 → 영어';
  document.getElementById('qWord').textContent = qWord;
  document.getElementById('quizCard').dataset.ans = ans;
  if (mode === 'choice') renderOpts(q, showEn, ans);
  else {
    const inp = document.getElementById('ansInput');
    inp.value = ''; inp.className = 'ans-input'; inp.disabled = false;
    inp.placeholder = showEn ? '한국어 뜻을 입력하세요...' : '영어 단어를 입력하세요...';
    setTimeout(() => inp.focus(), 80);
  }
}

function renderOpts(q, showEn, correctAns) {
  const pool = VOCAB[curDay].words.filter(w => w !== q);
  const wrongs = shuffle(pool).slice(0,3).map(w => showEn ? w.kr : w.en);
  const opts = shuffle([correctAns, ...wrongs]);
  const grid = document.getElementById('optGrid');
  grid.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => pickOpt(btn, opt, correctAns);
    grid.appendChild(btn);
  });
}

function pickOpt(btn, sel, correctAns) {
  if (answered) return;
  answered = true;
  const ok = sel === correctAns;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctAns) b.classList.add('ca');
  });
  if (!ok) btn.classList.add('wa');
  handleResult(ok, correctAns);
}

function submitInput() {
  if (answered) { nextQ(); return; }
  const inp = document.getElementById('ansInput');
  const userAns = inp.value.trim();
  if (!userAns) return;
  const correctAns = document.getElementById('quizCard').dataset.ans;
  const norm = s => s.replace(/[~\s\[\]()·,\.\-]/g,'').toLowerCase();
  const ok = norm(userAns) === norm(correctAns) ||
    correctAns.split(',').some(p => norm(userAns) === norm(p.trim()));
  inp.className = 'ans-input ' + (ok ? 'ci' : 'wi');
  inp.disabled = true;
  handleResult(ok, correctAns);
}

function handleResult(ok, correctAns) {
  answered = true;
  const fb = document.getElementById('feedback');
  const card = document.getElementById('quizCard');
  if (ok) {
    corr++;
    fb.textContent = '✓ 정답!';
    fb.className = 'feedback show fc';
    card.classList.add('cf');
  } else {
    wrng++;
    fb.textContent = `✗ 오답! 정답: ${correctAns}`;
    fb.className = 'feedback show fw';
    card.classList.add('wf');
    wrongWords.push(questions[qIdx]);
  }
  updateScores(); updateProgress();
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQ() { qIdx++; renderQ(); }

function updateScores() {
  document.getElementById('sC').textContent = corr;
  document.getElementById('sW').textContent = wrng;
  document.getElementById('sR').textContent = Math.max(0, questions.length - qIdx);
}
function updateProgress() {
  document.getElementById('pb').style.width = (questions.length ? qIdx/questions.length*100 : 0) + '%';
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultScreen').classList.add('show');
  const total = questions.length, pct = Math.round(corr/total*100);
  document.getElementById('rScore').textContent = `${corr}/${total}`;
  let e = '😅', m = '더 열심히 해봐요!';
  if (pct>=90){e='🏆';m='완벽해요! 최고의 실력!';}
  else if (pct>=70){e='🎉';m='잘 했어요! 조금만 더!';}
  else if (pct>=50){e='💪';m='반은 맞췄어요, 화이팅!';}
  document.getElementById('rEmoji').textContent = e;
  document.getElementById('rMsg').textContent = `${pct}점 · ${m}`;
  const wl = document.getElementById('wrongList');
  wl.innerHTML = wrongWords.length
    ? `<h3>✗ 틀린 단어 (${wrongWords.length}개)</h3>` +
      wrongWords.map(w=>`<div class="wrong-item"><span class="wi-en">${w.en}</span><span class="wi-kr">${w.kr}</span></div>`).join('')
    : '';
}

function restartDay() { initDay(curDay); }
function reviewWrong() {
  if (!wrongWords.length) { restartDay(); return; }
  questions = shuffle([...wrongWords]);
  qIdx = corr = wrng = 0; wrongWords = [];
  updateScores(); updateProgress();
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  renderQ();
}

// Build tabs
function buildTabs() {
  const c = document.getElementById('dayTabs');
  Object.entries(VOCAB).forEach(([key, data]) => {
    const tab = document.createElement('div');
    tab.className = 'day-tab';
    tab.dataset.day = key.replace('day','');
    tab.style.setProperty('--dc', data.color);
    tab.innerHTML = `<div class="dn">${data.label.toUpperCase()}</div>
      <div class="dt">${data.title}</div>
      <div class="ds">${data.sub}</div>
      <div class="dc">${data.words.length}개</div>`;
    tab.onclick = () => initDay(key);
    c.appendChild(tab);
  });
}

buildTabs();
initDay('day1');

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered && mode==='input') submitInput();
    else if (answered) nextQ();
  }
});
</script>
