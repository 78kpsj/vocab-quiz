<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>예문 기반 퀴즈 DAY 01~08</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0);}
:root{--bg:#0a0f1e;--s1:#111827;--s2:#1a2235;--p:#818cf8;--p2:#34d399;--ok:#4ade80;--ng:#f87171;--tx:#e2e8f0;--txd:#64748b;--br:#1e2d40;--hl:#fbbf24;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(129,140,248,.08) 0%,transparent 70%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 14px 48px;}

/* HEADER */
header{text-align:center;padding:22px 0 16px;}
.main-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:10px;letter-spacing:2px;background:linear-gradient(90deg,#818cf8,#34d399);color:#0a0f1e;}
header h1{font-size:22px;font-weight:900;margin-bottom:4px;}
header h1 b{background:linear-gradient(90deg,#818cf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{color:var(--txd);font-size:12px;}
.home-btn{display:inline-block;margin-bottom:12px;padding:6px 14px;background:var(--s1);border:1px solid var(--br);border-radius:20px;color:var(--txd);font-size:12px;text-decoration:none;}

/* DAY FILTER */
.filter-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--txd);margin-bottom:7px;text-transform:uppercase;}
.day-filter{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.df-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--br);background:var(--s1);color:var(--txd);cursor:pointer;-webkit-appearance:none;}
.df-btn.on{border-color:var(--dc);color:var(--dc);background:var(--s2);}
.df-btn[data-d="all"]{--dc:#4ade80;}
.df-btn[data-d="1"]{--dc:#7c5cfc;}.df-btn[data-d="2"]{--dc:#fc5c7d;}
.df-btn[data-d="3"]{--dc:#38bdf8;}.df-btn[data-d="4"]{--dc:#fcb85c;}
.df-btn[data-d="5"]{--dc:#a78bfa;}.df-btn[data-d="6"]{--dc:#f472b6;}
.df-btn[data-d="7"]{--dc:#34d399;}.df-btn[data-d="8"]{--dc:#fb923c;}

/* QTYPE + MODE */
.toggle-row{display:flex;gap:8px;margin-bottom:10px;}
.tog-grp{flex:1;display:flex;background:var(--s1);border:1px solid var(--br);border-radius:10px;overflow:hidden;}
.tog-btn{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--txd);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.tog-btn.on{background:var(--s2);color:var(--tx);}

/* SCORES */
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.sc{background:var(--s1);border:1px solid var(--br);border-radius:10px;padding:10px 6px;text-align:center;}
.sc-n{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;}
.sc-l{font-size:10px;color:var(--txd);margin-top:2px;}
.sc.ok .sc-n{color:var(--ok);}.sc.ng .sc-n{color:var(--ng);}.sc.re .sc-n{color:var(--p);}
.pg-wrap{background:var(--s1);border-radius:3px;height:5px;margin-bottom:14px;overflow:hidden;}
.pg-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:3px;transition:width .35s;}

/* QUESTION CARD */
.qcard{background:var(--s1);border:2px solid var(--br);border-radius:16px;padding:20px 16px;margin-bottom:12px;position:relative;transition:border-color .2s,background .2s;}
.qcard.fl-ok{border-color:var(--ok);background:rgba(74,222,128,.05);}
.qcard.fl-ng{border-color:var(--ng);background:rgba(248,113,113,.05);}

.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.q-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.q-day-tag{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;color:#0a0f1e;}
.q-type-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid;}
.q-type-tag.blank{border-color:#818cf8;color:#818cf8;}
.q-type-tag.trans{border-color:#34d399;color:#34d399;}
.q-num{font-family:'Space Mono',monospace;font-size:10px;color:var(--txd);}

/* SENTENCE */
.sentence-en{font-size:15px;line-height:1.8;color:var(--tx);margin-bottom:10px;word-break:break-word;}
.sentence-en .blank{display:inline-block;background:rgba(129,140,248,.15);border-bottom:2px solid #818cf8;padding:0 4px;min-width:80px;color:#818cf8;font-weight:700;border-radius:2px;text-align:center;}
.sentence-kr{font-size:13px;line-height:1.7;color:var(--txd);border-left:2px solid var(--br);padding-left:10px;margin-bottom:8px;}
.sentence-kr .blank-kr{color:var(--hl);font-weight:700;}
.word-hint{font-size:11px;color:var(--txd);margin-top:6px;}
.word-hint b{color:var(--hl);}

/* OPTIONS */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.opt{padding:13px 10px;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;text-align:left;line-height:1.4;min-height:48px;word-break:keep-all;-webkit-appearance:none;}
.opt:active{background:var(--s2);}
.opt.ans-ok{border-color:var(--ok)!important;background:rgba(74,222,128,.12)!important;color:var(--ok);font-weight:700;}
.opt.ans-ng{border-color:var(--ng)!important;background:rgba(248,113,113,.12)!important;color:var(--ng);}
.opt:disabled{cursor:default;}

/* INPUT */
.inp-wrap{display:flex;gap:8px;margin-bottom:12px;}
.ans-inp{flex:1;padding:13px 14px;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);-webkit-text-fill-color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:15px;outline:none;-webkit-appearance:none;}
.ans-inp:focus{border-color:var(--p);}
.ans-inp:disabled{opacity:1;-webkit-text-fill-color:var(--tx);}
.ans-inp.i-ok{border-color:var(--ok);background:rgba(74,222,128,.08);-webkit-text-fill-color:var(--ok);}
.ans-inp.i-ng{border-color:var(--ng);background:rgba(248,113,113,.08);-webkit-text-fill-color:var(--ng);}
.sub-btn{padding:13px 16px;background:var(--p);border:none;border-radius:12px;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none;}
.sub-btn:active{opacity:.8;}

/* FEEDBACK */
.fb{display:none;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:10px;word-break:keep-all;line-height:1.5;}
.fb.show{display:block;}
.fb.fb-ok{background:rgba(74,222,128,.1);color:var(--ok);border:1px solid rgba(74,222,128,.3);}
.fb.fb-ng{background:rgba(248,113,113,.1);color:var(--ng);border:1px solid rgba(248,113,113,.3);}
.next-btn{display:none;width:100%;padding:14px;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;-webkit-appearance:none;}
.next-btn:active{border-color:var(--p);}
.hint{text-align:center;color:var(--txd);font-size:11px;margin-bottom:8px;}

/* RESULT */
.result{display:none;text-align:center;padding:36px 16px;background:var(--s1);border:1px solid var(--br);border-radius:16px;margin-bottom:16px;}
.r-emoji{font-size:50px;margin-bottom:12px;}
.r-score{font-family:'Space Mono',monospace;font-size:42px;font-weight:700;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.r-msg{color:var(--txd);font-size:13px;margin-bottom:20px;}
.bk{margin:16px 0;text-align:left;}
.bk h3{font-size:10px;color:var(--txd);margin-bottom:10px;font-family:'Space Mono',monospace;letter-spacing:1px;}
.bk-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.bk-label{font-size:10px;font-weight:700;width:48px;flex-shrink:0;}
.bk-bar-wrap{flex:1;background:var(--s2);border-radius:3px;height:7px;overflow:hidden;}
.bk-bar{height:100%;border-radius:3px;transition:width .5s;}
.bk-pct{font-family:'Space Mono',monospace;font-size:10px;width:34px;text-align:right;flex-shrink:0;}
.r-btn{display:inline-block;padding:12px 20px;margin:4px;border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.r-btn.main{background:linear-gradient(90deg,var(--p),var(--p2));color:#0a0f1e;}
.r-btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--br);}
.r-btn:active{opacity:.8;}
.wl{margin-top:20px;text-align:left;}
.wl h3{font-size:12px;color:var(--ng);margin-bottom:8px;}
.wi{padding:8px 10px;background:var(--s2);border-radius:8px;margin-bottom:6px;font-size:12px;}
.wi-word{font-weight:700;margin-bottom:3px;}
.wi-ans{color:var(--txd);font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="home-btn" href="index.html">← 목록으로</a><br>
  <div class="main-badge">📖 예문 퀴즈</div>
  <h1>예문으로 익히는 <b>어휘</b></h1>
  <p>DAY 01~08 · 빈칸 채우기 + 우리말 해석 혼합</p>
</header>

<div class="filter-lbl">DAY 범위 선택</div>
<div class="day-filter">
  <button class="df-btn on" data-d="all" onclick="toggleDay('all')">전체</button>
  <button class="df-btn" data-d="1" onclick="toggleDay('1')">D1</button>
  <button class="df-btn" data-d="2" onclick="toggleDay('2')">D2</button>
  <button class="df-btn" data-d="3" onclick="toggleDay('3')">D3</button>
  <button class="df-btn" data-d="4" onclick="toggleDay('4')">D4</button>
  <button class="df-btn" data-d="5" onclick="toggleDay('5')">D5</button>
  <button class="df-btn" data-d="6" onclick="toggleDay('6')">D6</button>
  <button class="df-btn" data-d="7" onclick="toggleDay('7')">D7</button>
  <button class="df-btn" data-d="8" onclick="toggleDay('8')">D8</button>
</div>

<div class="toggle-row">
  <div class="tog-grp">
    <button class="tog-btn on" id="btnC" onclick="setMode('c')">📝 객관식</button>
    <button class="tog-btn" id="btnI" onclick="setMode('i')">✏️ 주관식</button>
  </div>
  <div class="tog-grp">
    <button class="tog-btn on" id="tAll" onclick="setQtype('all')">혼합</button>
    <button class="tog-btn" id="tBlank" onclick="setQtype('blank')">빈칸</button>
    <button class="tog-btn" id="tTrans" onclick="setQtype('trans')">해석</button>
  </div>
</div>

<div class="scores">
  <div class="sc ok"><div class="sc-n" id="sOk">0</div><div class="sc-l">정답</div></div>
  <div class="sc ng"><div class="sc-n" id="sNg">0</div><div class="sc-l">오답</div></div>
  <div class="sc re"><div class="sc-n" id="sRe">0</div><div class="sc-l">남은 문제</div></div>
</div>
<div class="pg-wrap"><div class="pg-fill" id="pg" style="width:0%"></div></div>

<div id="quizArea">
  <div class="qcard" id="qcard">
    <div class="q-top">
      <div class="q-tags">
        <span class="q-day-tag" id="qdtag">D1</span>
        <span class="q-type-tag blank" id="qttag">빈칸 채우기</span>
      </div>
      <span class="q-num" id="qnum">1/?</span>
    </div>
    <div class="sentence-en" id="sentEn"></div>
    <div class="sentence-kr" id="sentKr"></div>
    <div class="word-hint" id="wordHint"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="inp-wrap" id="inpWrap" style="display:none">
    <input class="ans-inp" id="inp" placeholder="답을 입력하세요..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" onkeydown="if(event.key==='Enter'||event.keyCode===13)doSubmit()"/>
    <button class="sub-btn" onclick="doSubmit()">확인</button>
  </div>
  <div class="fb" id="fb"></div>
  <button class="next-btn" id="nextBtn" onclick="doNext()">다음 문제 →</button>
  <div class="hint" id="hint">← 스와이프로 다음 문제 →</div>
</div>

<div class="result" id="result">
  <div class="r-emoji" id="rEmoji">🎉</div>
  <div class="r-score" id="rScore">0/0</div>
  <div class="r-msg" id="rMsg"></div>
  <div class="bk" id="bk"></div>
  <button class="r-btn main" onclick="restart()">🔄 다시 풀기</button>
  <button class="r-btn sec" onclick="retryWrong()">✗ 틀린 것만</button>
  <div class="wl" id="wl"></div>
</div>
</div>

<script>
// ============================================================
// SENTENCE DATA
// type: 'blank' = 빈칸채우기(영어→단어), 'trans' = 해석고르기(문장→우리말 뜻)
// word: 정답 단어(영어)
// ans: 정답(blank=영어단어, trans=한글 뜻)
// distractors: 오답 보기 (blank=다른 영어단어들, trans=다른 한글 뜻들)
// ============================================================
var SENTS=[
 // ─── DAY 01 ───
 {d:1,type:'blank',word:'alleviate',
  en:'Ibuprofen can help <BLANK> the pain and swelling caused by inflammation.',
  kr:'이부프로펜은 염증으로 인한 통증과 붓기를 ____ 하는 데 도움이 될 수 있다.',
  ans:'alleviate',dist:['submerge','dispute','overload']},
 {d:1,type:'trans',word:'adjacent',
  en:'The library is adjacent to the main lecture hall, making it easy for students to study between classes.',
  kr:'도서관은 주요 강의실에 ____하여, 학생들이 수업 사이에 공부하기 편리하다.',
  ans:'인접하여',dist:['대립하여','초과하여','위협하여']},
 {d:1,type:'blank',word:'cumulative',
  en:'The <BLANK> effect of small daily savings can lead to significant wealth over time.',
  kr:'매일 조금씩 저축하는 것의 ____ 효과는 시간이 지남에 따라 상당한 재산으로 이어질 수 있다.',
  ans:'cumulative',dist:['hazardous','viable','fierce']},
 {d:1,type:'trans',word:'spur',
  en:'Competition can spur innovation, pushing companies to develop better products.',
  kr:'경쟁은 혁신을 ____, 기업들이 더 나은 제품을 개발하도록 밀어붙인다.',
  ans:'자극할 수 있다',dist:['지연시킬 수 있다','방해할 수 있다','감소시킬 수 있다']},
 {d:1,type:'blank',word:'dispute',
  en:'The two countries entered into a <BLANK> over the ownership of the small island.',
  kr:'두 나라는 그 작은 섬의 소유권을 두고 ____에 들어갔다.',
  ans:'dispute',dist:['standstill','domain','allocation']},
 {d:1,type:'trans',word:'viable',
  en:'Solar energy is now a viable alternative to fossil fuels in many regions.',
  kr:'태양에너지는 이제 많은 지역에서 화석 연료의 ____ 대안이 되었다.',
  ans:'실행 가능한',dist:['위험한','부족한','이론적인']},
 {d:1,type:'blank',word:'submerge',
  en:'When the tide rises, the low-lying coastal road becomes <BLANK>d under water.',
  kr:'조수가 오르면 저지대 해안 도로는 물속에 ____된다.',
  ans:'submerge',dist:['startle','hover','encompass']},
 {d:1,type:'trans',word:'hazard',
  en:'Exposed electrical wires are a serious hazard that must be repaired immediately.',
  kr:'노출된 전선은 즉시 수리해야 하는 심각한 ____이다.',
  ans:'위험 요소',dist:['유인책','논쟁','자극제']},
 {d:1,type:'blank',word:'domain',
  en:'Artificial intelligence is rapidly transforming every <BLANK> of modern life.',
  kr:'인공지능은 현대 생활의 모든 ____을 빠르게 변화시키고 있다.',
  ans:'domain',dist:['hover','curb','standstill']},
 {d:1,type:'trans',word:'encompass',
  en:'The new curriculum encompasses a wide range of subjects from science to the arts.',
  kr:'새 교육과정은 과학에서 예술까지 다양한 과목을 ____.',
  ans:'포함한다',dist:['억제한다','분배한다','위협한다']},

 // ─── DAY 02 ───
 {d:2,type:'blank',word:'bewilder',
  en:'The sudden change in policy <BLANK>ed even the most experienced staff members.',
  kr:'갑작스러운 정책 변화는 가장 경험 많은 직원들조차 ____하게 만들었다.',
  ans:'bewilder',dist:['dismiss','crawl','relocate']},
 {d:2,type:'trans',word:'enlightened',
  en:'An enlightened leader listens to diverse opinions before making important decisions.',
  kr:'____ 지도자는 중요한 결정을 내리기 전에 다양한 의견을 듣는다.',
  ans:'계몽된',dist:['독선적인','충동적인','방어적인']},
 {d:2,type:'blank',word:'elusive',
  en:'The perfect solution to the problem remained <BLANK> despite months of research.',
  kr:'수개월의 연구에도 불구하고 문제에 대한 완벽한 해결책은 ____한 채로 남아 있었다.',
  ans:'elusive',dist:['adverse','stale','rampant']},
 {d:2,type:'trans',word:'implement',
  en:'The government will implement new regulations to reduce carbon emissions by 2030.',
  kr:'정부는 2030년까지 탄소 배출량을 줄이기 위한 새로운 규정을 ____.',
  ans:'시행할 것이다',dist:['폐지할 것이다','연기할 것이다','비판할 것이다']},
 {d:2,type:'blank',word:'adhere',
  en:'All employees must <BLANK> to the company\'s strict code of conduct.',
  kr:'모든 직원은 회사의 엄격한 행동 강령을 ____야 한다.',
  ans:'adhere',dist:['obsess','dismiss','rotate']},
 {d:2,type:'trans',word:'metaphor',
  en:'The author uses the metaphor of a journey to describe the process of growing up.',
  kr:'저자는 성장의 과정을 묘사하기 위해 여행의 ____을 사용한다.',
  ans:'은유',dist:['역설','강조','반복']},
 {d:2,type:'blank',word:'apprehend',
  en:'Police worked through the night to <BLANK> the suspects before they could flee.',
  kr:'경찰은 용의자들이 도주하기 전에 ____하기 위해 밤새 일했다.',
  ans:'apprehend',dist:['adorn','graze','relocate']},
 {d:2,type:'trans',word:'adverse',
  en:'The expedition was cancelled due to adverse weather conditions in the mountains.',
  kr:'그 탐험은 산악 지역의 ____ 기상 조건으로 인해 취소되었다.',
  ans:'불리한',dist:['유리한','평온한','예측 가능한']},
 {d:2,type:'blank',word:'adorn',
  en:'Flowers <BLANK>ed the entrance of the wedding hall beautifully.',
  kr:'꽃들이 결혼식장 입구를 아름답게 ____했다.',
  ans:'adorn',dist:['dismiss','crawl','submerge']},
 {d:2,type:'trans',word:'deterioration',
  en:'The deterioration of air quality in major cities is causing serious health problems.',
  kr:'주요 도시들의 공기 질 ____은 심각한 건강 문제를 야기하고 있다.',
  ans:'악화',dist:['개선','유지','측정']},

function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}

function toggleDay(d){
  var btns=document.querySelectorAll('.df-btn');

    for(var k in selDays)selDays[k]=true;
    btns.forEach(function(b){b.classList.toggle('on',true);});
  } else {
    var di=parseInt(d);
    var allOn=Object.values(selDays).every(Boolean);
    if(allOn){for(var k in selDays)selDays[k]=false;selDays[di]=true;}
    else{selDays[di]=!selDays[di];if(!Object.values(selDays).some(Boolean)){for(var k in selDays)selDays[k]=true;}}
    var anyFalse=Object.values(selDays).some(function(v){return !v;});
    btns.forEach(function(b){
      var bd=b.getAttribute('data-d');
      if(bd==='all')b.classList.toggle('on',!anyFalse);
      else b.classList.toggle('on',!!selDays[parseInt(bd)]);
    });
  }
  startQuiz();
}

function setMode(m){
  mode=m;
  document.getElementById('btnC').classList.toggle('on',m==='c');
  document.getElementById('btnI').classList.toggle('on',m==='i');
  document.getElementById('opts').style.display=m==='c'?'':'none';
  document.getElementById('inpWrap').style.display=m==='i'?'':'none';
  startQuiz();
}

function setQtype(t){
  qtype=t;
  ['All','Blank','Trans'].forEach(function(x){
    document.getElementById('t'+x).classList.toggle('on',t===x.toLowerCase());
  });
  startQuiz();
}

function startQuiz(){
  qs=shuffle(buildPool());
  qi=nOk=nNg=0;wrongs=[];answered=false;
  dayStats={};for(var i=1;i<=8;i++)dayStats[i]={ok:0,total:0};
  updateScores();updatePg();
  document.getElementById('result').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQ();
}

function renderQ(){
  answered=false;
  document.getElementById('fb').className='fb';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('hint').style.display='';
  document.getElementById('qcard').className='qcard';
  if(qi>=qs.length){showResult();return;}

  var q=qs[qi];
  var col=DAY_COLOR[q.d];

  document.getElementById('qnum').textContent=(qi+1)+' / '+qs.length;

  // day tag
  var dt=document.getElementById('qdtag');
  dt.textContent='D'+q.d;
  dt.style.background=col;

  // type tag
  var tt=document.getElementById('qttag');
  if(q.type==='blank'){
    tt.textContent='빈칸 채우기';
    tt.className='q-type-tag blank';
  } else {
    tt.textContent='우리말 해석';
    tt.className='q-type-tag trans';
  }

  // Sentence rendering
  var sentEn=document.getElementById('sentEn');
  var sentKr=document.getElementById('sentKr');
  var wordHint=document.getElementById('wordHint');

  if(q.type==='blank'){
    // Show sentence with blank
    var html=q.en.replace('<BLANK>','<span class="blank">[  ?  ]</span>');
    sentEn.innerHTML=html;
    sentKr.innerHTML=q.kr.replace('____','<span class="blank-kr">?</span>');
    wordHint.innerHTML='<b>단어 힌트:</b> '+q.word[0]+'___  ('+q.word.length+'글자)';
    document.getElementById('qcard').dataset.ans=q.ans;
    document.getElementById('qcard').dataset.full=q.ans;
  } else {
    // Show full sentence, answer is Korean meaning
    sentEn.innerHTML=q.en.replace(new RegExp(q.word,'gi'),function(m){return '<b style="color:'+col+'">'+m+'</b>';});
    sentKr.innerHTML=q.kr.replace('____','<span class="blank-kr">?</span>');
    wordHint.innerHTML='<b>단어:</b> <span style="color:'+col+'">'+q.word+'</span>';
    document.getElementById('qcard').dataset.ans=q.ans;
    document.getElementById('qcard').dataset.full=q.ans;
  }

  if(mode==='c'){
    var opts=shuffle([q.ans].concat(q.dist));
    var g=document.getElementById('opts');g.innerHTML='';
    opts.forEach(function(o){
      var btn=document.createElement('button');
      btn.className='opt';btn.textContent=o;
      btn.setAttribute('onclick','pickOpt(this,"'+o.replace(/"/g,'&quot;')+'")');
      g.appendChild(btn);
    });
  } else {
    var inp=document.getElementById('inp');
    inp.value='';inp.className='ans-inp';inp.disabled=false;
    inp.placeholder=q.type==='blank'?'영어 단어를 입력하세요...':'우리말 뜻을 입력하세요...';
  }
}

function pickOpt(btn,sel){
  if(answered)return;answered=true;
  var ans=document.getElementById('qcard').dataset.ans;
  var ok=(sel===ans);
  var btns=document.getElementById('opts').querySelectorAll('.opt');
  for(var i=0;i<btns.length;i++){btns[i].disabled=true;if(btns[i].textContent===ans)btns[i].classList.add('ans-ok');}
  if(!ok)btn.classList.add('ans-ng');
  handleResult(ok);
}

function doSubmit(){
  if(answered){doNext();return;}
  var inp=document.getElementById('inp'),v=inp.value.trim();if(!v)return;
  var ans=document.getElementById('qcard').dataset.ans;
  var norm=function(s){return s.replace(/[\s\[\]()·,\.\-]/g,'').toLowerCase();};
  var ok=norm(v)===norm(ans);
  inp.className='ans-inp '+(ok?'i-ok':'i-ng');inp.disabled=true;
  handleResult(ok);
}

function handleResult(ok){
  answered=true;
  var q=qs[qi];
  dayStats[q.d].total++;
  var fb=document.getElementById('fb'),card=document.getElementById('qcard');
  if(ok){
    nOk++;dayStats[q.d].ok++;
    fb.textContent='✓ 정답!';fb.className='fb show fb-ok';card.className='qcard fl-ok';
  } else {
    nNg++;wrongs.push(q);
    var msg='✗ 오답!  정답: '+q.ans;
    if(q.type==='blank') msg+=' ('+q.word+')';
    fb.textContent=msg;fb.className='fb show fb-ng';card.className='qcard fl-ng';
  }
  updateScores();updatePg();
  document.getElementById('nextBtn').style.display='block';
  document.getElementById('hint').style.display='none';
}

function doNext(){qi++;renderQ();}

function updateScores(){
  document.getElementById('sOk').textContent=nOk;
  document.getElementById('sNg').textContent=nNg;
  document.getElementById('sRe').textContent=Math.max(0,qs.length-qi);
}
function updatePg(){document.getElementById('pg').style.width=(qs.length?qi/qs.length*100:0)+'%';}

function showResult(){
  document.getElementById('quizArea').style.display='none';
  var r=document.getElementById('result');r.style.display='block';
  var tot=qs.length,pct=Math.round(nOk/tot*100);
  document.getElementById('rScore').textContent=nOk+'/'+tot;
  var e='😅',m='예문을 더 꼼꼼히 읽어봐요!';
  if(pct>=90){e='🏆';m='완벽해요! 예문 마스터!';}
  else if(pct>=70){e='🎉';m='잘 했어요! 조금만 더!';}
  else if(pct>=50){e='💪';m='반은 맞췄어요, 화이팅!';}
  document.getElementById('rEmoji').textContent=e;
  document.getElementById('rMsg').textContent=pct+'점 · '+m;

  // DAY breakdown
  var bkHtml='<h3>DAY별 정답률</h3>';
  for(var d=1;d<=8;d++){
    var ds=dayStats[d];
    if(!ds||ds.total===0)continue;
    var dp=Math.round(ds.ok/ds.total*100),col=DAY_COLOR[d];
    bkHtml+='<div class="bk-row">'
      +'<div class="bk-label" style="color:'+col+'">DAY 0'+d+'</div>'
      +'<div class="bk-bar-wrap"><div class="bk-bar" style="width:'+dp+'%;background:'+col+'"></div></div>'
      +'<div class="bk-pct" style="color:'+col+'">'+dp+'%</div></div>';
  }
  document.getElementById('bk').innerHTML=bkHtml;

  // Wrong list
  var wl=document.getElementById('wl');
  if(wrongs.length){
    var h='<h3>✗ 틀린 문제 ('+wrongs.length+'개)</h3>';
    wrongs.forEach(function(q){
      var col=DAY_COLOR[q.d];
      h+='<div class="wi">'
        +'<div class="wi-word" style="color:'+col+'">'+q.word
        +' <small style="color:var(--txd);font-size:10px;">[D'+q.d+' · '+(q.type==='blank'?'빈칸':'해석')+']</small></div>'
        +'<div class="wi-ans">정답: '+q.ans+'</div>'
        +'<div class="wi-ans" style="margin-top:3px;color:var(--tx)">'+q.en.replace('<BLANK>','['+q.word+']')+'</div>'
        +'</div>';
    });
    wl.innerHTML=h;
  }else{wl.innerHTML='';}
  try{r.scrollIntoView(true);}catch(e2){window.scrollTo(0,0);}
}

function restart(){startQuiz();}
function retryWrong(){
  if(!wrongs.length){restart();return;}
  qs=shuffle(wrongs.slice());qi=nOk=nNg=0;wrongs=[];answered=false;
  dayStats={};for(var i=1;i<=8;i++)dayStats[i]={ok:0,total:0};
  updateScores();updatePg();
  document.getElementById('result').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQ();
}

(function(){
  var sx=0,sy=0,area=document.getElementById('quizArea');
  area.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  area.addEventListener('touchend',function(e){
    if(!answered)return;
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)doNext();
  },{passive:true});
})();

startQuiz();
</script>
</body>
</html>
