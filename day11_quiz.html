<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DAY 11 단어 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0);}
:root{--bg:#0f0f1a;--s1:#181828;--s2:#22223a;--p:#f9a8d4;--p2:#c084fc;--ok:#4ade80;--ng:#f87171;--tx:#e8e8f0;--txd:#6666aa;--br:#2a2a4a;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.wrap{max-width:600px;margin:0 auto;padding:16px 14px 48px;}
header{text-align:center;padding:20px 0 16px;}
.day-badge{display:inline-block;background:var(--p);color:#0f0f1a;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;margin-bottom:10px;letter-spacing:2px;}
header h1{font-size:22px;font-weight:900;margin-bottom:4px;}
header h1 span{color:var(--p);}
header p{color:var(--txd);font-size:12px;}
.home-btn{display:inline-block;margin-bottom:14px;padding:7px 16px;background:var(--s1);border:1px solid var(--br);border-radius:20px;color:var(--txd);font-size:12px;text-decoration:none;cursor:pointer;}
.mode-wrap{display:flex;background:var(--s1);border:1px solid var(--br);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.mode-btn{flex:1;padding:12px 4px;border:none;background:transparent;color:var(--txd);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.mode-btn.on{background:var(--s2);color:var(--tx);}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.sc{background:var(--s1);border:1px solid var(--br);border-radius:10px;padding:10px 6px;text-align:center;}
.sc-n{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;}
.sc-l{font-size:10px;color:var(--txd);margin-top:2px;}
.sc.ok .sc-n{color:var(--ok);}.sc.ng .sc-n{color:var(--ng);}.sc.re .sc-n{color:var(--p);}
.pg-wrap{background:var(--s1);border-radius:3px;height:5px;margin-bottom:14px;overflow:hidden;}
.pg-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:3px;transition:width .35s;}
.qtype-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.qtype-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid;cursor:pointer;}
.chip-all{border-color:#f9a8d4;color:#f9a8d4;}.chip-all.on{background:#f9a8d4;color:#0f0f1a;}
.chip-k{border-color:#7c5cfc;color:#7c5cfc;}.chip-k.on{background:#7c5cfc;color:#fff;}
.chip-s{border-color:#60a5fa;color:#60a5fa;}.chip-s.on{background:#60a5fa;color:#0f0f1a;}
.chip-a{border-color:#fb923c;color:#fb923c;}.chip-a.on{background:#fb923c;color:#0f0f1a;}
.qcard{background:var(--s1);border:2px solid var(--br);border-radius:16px;padding:24px 18px;margin-bottom:12px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;transition:border-color .2s,background .2s;}
.qcard.fl-ok{border-color:var(--ok);background:rgba(74,222,128,.06);}
.qcard.fl-ng{border-color:var(--ng);background:rgba(248,113,113,.06);}
.q-meta{position:absolute;top:10px;right:13px;font-family:'Space Mono',monospace;font-size:9px;color:var(--txd);}
.q-type-lbl{font-size:9px;letter-spacing:2px;color:var(--txd);margin-bottom:8px;text-transform:uppercase;}
.q-word{font-size:26px;font-weight:900;line-height:1.2;word-break:keep-all;}
.q-sub{font-size:11px;color:var(--txd);margin-top:6px;line-height:1.5;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.opt{padding:15px 10px;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;text-align:left;line-height:1.4;min-height:52px;word-break:keep-all;-webkit-appearance:none;}
.opt:active{background:var(--s2);}
.opt.ans-ok{border-color:var(--ok)!important;background:rgba(74,222,128,.12)!important;color:var(--ok);font-weight:700;}
.opt.ans-ng{border-color:var(--ng)!important;background:rgba(248,113,113,.12)!important;color:var(--ng);}
.opt:disabled{cursor:default;}
.inp-wrap{display:flex;gap:8px;margin-bottom:12px;}
.ans-inp{flex:1;padding:13px 14px;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);-webkit-text-fill-color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;}
.ans-inp:focus{border-color:var(--p);}
.ans-inp:disabled{opacity:1;-webkit-text-fill-color:var(--tx);}
.ans-inp.i-ok{border-color:var(--ok);background:rgba(74,222,128,.08);-webkit-text-fill-color:var(--ok);}
.ans-inp.i-ng{border-color:var(--ng);background:rgba(248,113,113,.08);-webkit-text-fill-color:var(--ng);}
.sub-btn{padding:13px 18px;background:var(--p);border:none;border-radius:12px;color:#0f0f1a;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none;}
.sub-btn:active{opacity:.8;}
.fb{display:none;text-align:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:10px;word-break:keep-all;}
.fb.show{display:block;}
.fb.fb-ok{background:rgba(74,222,128,.1);color:var(--ok);border:1px solid rgba(74,222,128,.3);}
.fb.fb-ng{background:rgba(248,113,113,.1);color:var(--ng);border:1px solid rgba(248,113,113,.3);}
.next-btn{display:none;width:100%;padding:15px;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;-webkit-appearance:none;}
.next-btn:active{border-color:var(--p);}
.result{display:none;text-align:center;padding:36px 16px;background:var(--s1);border:1px solid var(--br);border-radius:16px;margin-bottom:16px;}
.r-emoji{font-size:48px;margin-bottom:12px;}
.r-score{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;color:var(--p);margin-bottom:6px;}
.r-msg{color:var(--txd);font-size:13px;margin-bottom:20px;}
.r-btn{display:inline-block;padding:12px 22px;margin:4px;background:var(--p);border:none;border-radius:12px;color:#0f0f1a;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.r-btn:active{opacity:.8;}
.r-btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--br);}
.wl{margin-top:20px;text-align:left;}
.wl h3{font-size:12px;color:var(--ng);margin-bottom:8px;}
.wi{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--s2);border-radius:8px;margin-bottom:5px;font-size:12px;}
.wi-en{font-weight:700;}.wi-kr{color:var(--txd);text-align:right;}
.hint{text-align:center;color:var(--txd);font-size:11px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home-btn" href="index.html">← 목록으로</a><br>
    <div class="day-badge">DAY 11</div>
    <h1>어휘 <span>퀴즈</span></h1>
    <p>0301~0330 · 한글뜻 / 유의어 / 반의어 혼합</p>
  </header>
  <div class="mode-wrap">
    <button class="mode-btn on" id="btnC" onclick="setMode('c')">📝 객관식</button>
    <button class="mode-btn" id="btnI" onclick="setMode('i')">✏️ 주관식</button>
  </div>
  <div class="qtype-row">
    <div class="qtype-chip chip-all on" id="chipAll" onclick="setType('all')">전체</div>
    <div class="qtype-chip chip-k" id="chipK" onclick="setType('k')">한글 뜻</div>
    <div class="qtype-chip chip-s" id="chipS" onclick="setType('s')">유의어</div>
    <div class="qtype-chip chip-a" id="chipA" onclick="setType('a')">반의어</div>
  </div>
  <div class="scores">
    <div class="sc ok"><div class="sc-n" id="sOk">0</div><div class="sc-l">정답</div></div>
    <div class="sc ng"><div class="sc-n" id="sNg">0</div><div class="sc-l">오답</div></div>
    <div class="sc re"><div class="sc-n" id="sRe">0</div><div class="sc-l">남은 문제</div></div>
  </div>
  <div class="pg-wrap"><div class="pg-fill" id="pg" style="width:0%"></div></div>
  <div id="quizArea">
    <div class="qcard" id="qcard">
      <div class="q-meta" id="qmeta">1/?</div>
      <div class="q-type-lbl" id="qtlbl">한글 뜻</div>
      <div class="q-word" id="qword">—</div>
      <div class="q-sub" id="qsub"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="inp-wrap" id="inpWrap" style="display:none">
      <input class="ans-inp" id="inp" placeholder="답을 입력하세요..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" onkeydown="if(event.key==='Enter'||event.keyCode===13)doSubmit()"/>
      <button class="sub-btn" onclick="doSubmit()">확인</button>
    </div>
    <div class="fb" id="fb"></div>
    <button class="next-btn" id="nextBtn" onclick="doNext()">다음 문제 →</button>
    <div class="hint" id="hint">← 스와이프로 다음 문제 →</div>
  </div>
  <div class="result" id="result">
    <div class="r-emoji" id="rEmoji">🎉</div>
    <div class="r-score" id="rScore">0/0</div>
    <div class="r-msg" id="rMsg"></div>
    <button class="r-btn" onclick="restart()">🔄 다시 풀기</button>
    <button class="r-btn sec" onclick="retryWrong()">✗ 틀린 것만</button>
    <div class="wl" id="wl"></div>
  </div>
</div>
<script>
var W=[
  {no:"0301",en:"pedestrian",
   k:"보행자 / 보행자의; 평범한, 단조로운",
   s:"walker, hiker / dull, boring, monotonous",a:""},
  {no:"0302",en:"vegetation",
   k:"초목, 식물",
   s:"plants, flora",a:""},
  {no:"0303",en:"aptitude",
   k:"소질, 적성, 재능",
   s:"talent, fitness, ability, competence",a:""},
  {no:"0304",en:"simulate",
   k:"가장하다, 흉내 내다; 모의실험하다",
   s:"pretend, imitate, mimic",a:""},
  {no:"0305",en:"legendary",
   k:"전설적인, 아주 유명한; 전설상의, 전설 속의",
   s:"fabled, heroic, celebrated, extraordinary / mythical",a:""},
  {no:"0306",en:"perpetuate",
   k:"영구화하다, 영속시키다",
   s:"preserve, sustain, immortalize",a:""},
  {no:"0307",en:"vigorous",
   k:"활발한, 격렬한",
   s:"energetic, powerful, active",a:""},
  {no:"0308",en:"destined",
   k:"~할 운명인, (운명으로) 예정된; ~로 향하는",
   s:"fated, predetermined / bound, heading",a:""},
  {no:"0309",en:"durable",
   k:"내구성이 있는, 오래가는",
   s:"long-lasting, resistant, enduring",a:""},
  {no:"0310",en:"pious",
   k:"경건한, 독실한",
   s:"religious, devoted, faithful",
   a:"impious"},
  {no:"0311",en:"infuse",
   k:"주입하다, 스며들게 하다",
   s:"inject, instill, implant",a:""},
  {no:"0312",en:"withhold",
   k:"억누르다, 억제하다; 보류하다, 주지 않고 두다",
   s:"suppress, repress, control, restrain / hold back, keep back, retain",a:""},
  {no:"0313",en:"attentive",
   k:"경청하는, 귀를 기울이는; 주의 깊은, 세심한",
   s:"listening, concentrating, watchful / polite, considerate, thoughtful, caring",a:""},
  {no:"0314",en:"deposit",
   k:"착수금, 보증금; 예금; 퇴적[침전]물 / (특정한 곳에) 놓다, 쌓다; 퇴적[침전]시키다; 예금[예치]하다",
   s:"prepayment, pledge / savings / sediment, residue, deposition / put, place, lay / bank, save",
   a:"withdrawal"},
  {no:"0315",en:"esteem",
   k:"존중, 존경 / 존경하다, 높이 평가하다; (~라고) 생각하다[여기다]",
   s:"respect, admiration / respect, admire, value / consider, deem, regard, think",a:""},
  {no:"0316",en:"proceed",
   k:"계속해서[이어서] 진행하다; 나아가다",
   s:"carry on, go ahead, continue / move forward",a:""},
  {no:"0317",en:"discriminate",
   k:"구별하다, 식별하다; 차별하다",
   s:"differentiate, distinguish / segregate, be prejudiced",a:""},
  {no:"0318",en:"confine",
   k:"제한하다, 한정하다; 가두다, 감금하다",
   s:"restrict, limit / enclose, imprison",a:""},
  {no:"0319",en:"signify",
   k:"의미하다, 나타내다",
   s:"mean, indicate, denote, symbolize, imply",a:""},
  {no:"0320",en:"incurable",
   k:"치유할 수 없는, 불치의",
   s:"untreatable, irremediable, terminal, fatal, deadly",
   a:"curable"},
  {no:"0321",en:"ascribe",
   k:"~의 탓[공]으로 돌리다, (기원 등을) ~에게 돌리다",
   s:"attribute",a:""},
  {no:"0322",en:"authorize",
   k:"권한을 부여하다, 위임하다; 정식으로 허가하다",
   s:"empower, commission, mandate / permit, sanction, allow, approve",a:""},
  {no:"0323",en:"dispel",
   k:"(근심 등을) 떨쳐 버리다, 없애다",
   s:"banish, eliminate, dismiss, disperse",a:""},
  {no:"0324",en:"collide",
   k:"충돌하다, 부딪치다; (의견 등이) 일치하지 않다, 상충하다",
   s:"crash, impact, bump / conflict, differ, diverge, disagree",a:""},
  {no:"0325",en:"numerical",
   k:"수의, 수와 관련된, 숫자로 나타낸",
   s:"numeral",a:""},
  {no:"0326",en:"futile",
   k:"헛된, 소용없는, 무익한",
   s:"useless, vain, fruitless",a:""},
  {no:"0327",en:"monopoly",
   k:"(상품·사업 등의) 독점(권)",
   s:"",a:""},
  {no:"0328",en:"induce",
   k:"설득하다, 유도하다; 유발하다, 초래하다",
   s:"persuade, convince / cause, bring about, lead to, result in",a:""},
  {no:"0329",en:"by and large",
   k:"대체로, 전반적으로",
   s:"on the whole, generally, mostly, in general",a:""},
  {no:"0330",en:"be inclined to do",
   k:"~하는 경향이 있다",
   s:"tend to do, have a tendency to do, be apt to do, be likely to do",a:""}
];

var mode='c',qtype='all';
var qs=[],qi=0,nOk=0,nNg=0,wrongs=[],answered=false;

function buildPool(){
  var pool=[];
  W.forEach(function(w){
    if(qtype==='all'||qtype==='k')pool.push({w:w,t:'k'});
    if((qtype==='all'||qtype==='s')&&w.s)pool.push({w:w,t:'s'});
    if((qtype==='all'||qtype==='a')&&w.a)pool.push({w:w,t:'a'});
  });
  return pool;
}
function shuffle(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}
function startQuiz(){
  qs=shuffle(buildPool());
  qi=nOk=nNg=0;wrongs=[];answered=false;
  updateScores();updatePg();
  document.getElementById('result').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQ();
}
function setMode(m){
  mode=m;
  document.getElementById('btnC').classList.toggle('on',m==='c');
  document.getElementById('btnI').classList.toggle('on',m==='i');
  document.getElementById('opts').style.display=m==='c'?'':'none';
  document.getElementById('inpWrap').style.display=m==='i'?'':'none';
  startQuiz();
}
function setType(t){
  qtype=t;
  var map={all:'chipAll',k:'chipK',s:'chipS',a:'chipA'};
  Object.keys(map).forEach(function(k){document.getElementById(map[k]).classList.toggle('on',k===t);});
  startQuiz();
}
function typeLbl(t){return t==='k'?'한글 뜻을 고르세요':t==='s'?'유의어(Synonym)를 고르세요':'반의어(Antonym)를 고르세요';}
function ansText(item){
  var src=item.t==='k'?item.w.k:item.t==='s'?item.w.s:item.w.a;
  return src.split('/')[0].split(',')[0].trim();
}
function getWrongOpts(item,n){
  var pool=shuffle(qs.filter(function(q){return q.t===item.t&&q.w.en!==item.w.en;}));
  var opts=[];
  for(var i=0;i<pool.length&&opts.length<n;i++){var t=ansText(pool[i]);if(t&&opts.indexOf(t)<0)opts.push(t);}
  if(opts.length<n){
    var extra=shuffle(W.filter(function(w){return w.en!==item.w.en;}));
    for(var j=0;j<extra.length&&opts.length<n;j++){
      var src=item.t==='k'?extra[j].k:item.t==='s'?extra[j].s:extra[j].a;
      if(!src)continue;
      var cand=src.split('/')[0].split(',')[0].trim();
      if(cand&&opts.indexOf(cand)<0)opts.push(cand);
    }
  }
  return opts.slice(0,n);
}
function renderQ(){
  answered=false;
  document.getElementById('fb').className='fb';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('hint').style.display='';
  document.getElementById('qcard').className='qcard';
  if(qi>=qs.length){showResult();return;}
  var item=qs[qi],ans=ansText(item);
  document.getElementById('qmeta').textContent=(qi+1)+' / '+qs.length;
  document.getElementById('qtlbl').textContent=typeLbl(item.t);
  document.getElementById('qword').textContent=item.w.en;
  document.getElementById('qsub').textContent=(item.t==='s'||item.t==='a')?'뜻: '+item.w.k.split('/')[0].trim():'';
  document.getElementById('qcard').dataset.ans=ans;
  document.getElementById('qcard').dataset.full=item.t==='k'?item.w.k:item.t==='s'?item.w.s:item.w.a;
  if(mode==='c'){
    var wrng=getWrongOpts(item,3),allOpts=shuffle([ans].concat(wrng));
    var g=document.getElementById('opts');g.innerHTML='';
    allOpts.forEach(function(o){
      var btn=document.createElement('button');
      btn.className='opt';btn.textContent=o;
      btn.setAttribute('onclick','pickOpt(this,"'+o.replace(/"/g,'&quot;')+'")');
      g.appendChild(btn);
    });
  }else{
    var inp=document.getElementById('inp');
    inp.value='';inp.className='ans-inp';inp.disabled=false;
    inp.placeholder=item.t==='k'?'한글 뜻을 입력하세요...':item.t==='s'?'유의어(영어)를 입력하세요...':'반의어(영어)를 입력하세요...';
  }
}
function pickOpt(btn,sel){
  if(answered)return;answered=true;
  var ans=document.getElementById('qcard').dataset.ans;
  var full=document.getElementById('qcard').dataset.full;
  var ok=(sel===ans);
  var btns=document.getElementById('opts').querySelectorAll('.opt');
  for(var i=0;i<btns.length;i++){btns[i].disabled=true;if(btns[i].textContent===ans)btns[i].classList.add('ans-ok');}
  if(!ok)btn.classList.add('ans-ng');
  handleResult(ok,full);
}
function doSubmit(){
  if(answered){doNext();return;}
  var inp=document.getElementById('inp'),v=inp.value.trim();if(!v)return;
  var full=document.getElementById('qcard').dataset.full;
  var norm=function(s){return s.replace(/[~\s\[\]()·,\.\-]/g,'').toLowerCase();};
  var tokens=full.split(/[,\/]/).map(function(s){return s.trim();}).filter(Boolean);
  var ok=tokens.some(function(t){return norm(v)===norm(t);});
  inp.className='ans-inp '+(ok?'i-ok':'i-ng');inp.disabled=true;
  handleResult(ok,full);
}
function handleResult(ok,full){
  answered=true;
  var fb=document.getElementById('fb'),card=document.getElementById('qcard');
  if(ok){nOk++;fb.textContent='✓ 정답!';fb.className='fb show fb-ok';card.className='qcard fl-ok';}
  else{nNg++;fb.textContent='✗ 오답!  정답: '+full;fb.className='fb show fb-ng';card.className='qcard fl-ng';wrongs.push(qs[qi]);}
  updateScores();updatePg();
  document.getElementById('nextBtn').style.display='block';
  document.getElementById('hint').style.display='none';
}
function doNext(){qi++;renderQ();}
function updateScores(){
  document.getElementById('sOk').textContent=nOk;
  document.getElementById('sNg').textContent=nNg;
  document.getElementById('sRe').textContent=Math.max(0,qs.length-qi);
}
function updatePg(){document.getElementById('pg').style.width=(qs.length?qi/qs.length*100:0)+'%';}
function showResult(){
  document.getElementById('quizArea').style.display='none';
  var r=document.getElementById('result');r.style.display='block';
  var tot=qs.length,pct=Math.round(nOk/tot*100);
  document.getElementById('rScore').textContent=nOk+'/'+tot;
  var e='😅',m='더 열심히 해봐요!';
  if(pct>=90){e='🏆';m='완벽해요! 최고의 실력!';}
  else if(pct>=70){e='🎉';m='잘 했어요! 조금만 더!';}
  else if(pct>=50){e='💪';m='반은 맞췄어요, 화이팅!';}
  document.getElementById('rEmoji').textContent=e;
  document.getElementById('rMsg').textContent=pct+'점 · '+m;
  var wl=document.getElementById('wl');
  if(wrongs.length){
    var h='<h3>✗ 틀린 단어 ('+wrongs.length+'개)</h3>';
    wrongs.forEach(function(it){
      var tl=it.t==='k'?'뜻':it.t==='s'?'유의어':'반의어';
      h+='<div class="wi"><span class="wi-en">'+it.w.en+'<small style="color:var(--txd);font-size:10px;margin-left:4px;">['+tl+']</small></span>'
        +'<span class="wi-kr">'+(it.t==='k'?it.w.k:it.t==='s'?it.w.s:it.w.a)+'</span></div>';
    });
    wl.innerHTML=h;
  }else{wl.innerHTML='';}
  try{r.scrollIntoView(true);}catch(e2){window.scrollTo(0,0);}
}
function restart(){startQuiz();}
function retryWrong(){
  if(!wrongs.length){restart();return;}
  qs=shuffle(wrongs.slice());qi=nOk=nNg=0;wrongs=[];answered=false;
  updateScores();updatePg();
  document.getElementById('result').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQ();
}
(function(){
  var sx=0,sy=0,area=document.getElementById('quizArea');
  area.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  area.addEventListener('touchend',function(e){
    if(!answered)return;
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)doNext();
  },{passive:true});
})();
startQuiz();
</script>
</body>
</html>
