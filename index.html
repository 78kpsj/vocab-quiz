<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #383838;
    --text: #f0ede8;
    --text2: #8a8680;
    --text3: #555250;
    --green: #4ade80;
    --green-dim: #1a3d27;
    --blue: #60a5fa;
    --blue-dim: #0f1e3a;
    --red: #f87171;
    --red-dim: #3d1a1a;
    --purple: #c084fc;
    --purple-dim: #2d1a4d;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Top nav ── */
  header {
    width: 100%;
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 1.25rem 2rem 0;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 8px;
  }

  /* Subject tabs */
  .subject-tabs {
    display: flex;
    gap: 0;
    padding: 0 2rem;
    margin-top: 1rem;
  }
  .subj-tab {
    position: relative;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--text3);
    transition: color 0.15s;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .subj-tab:hover { color: var(--text2); }
  .subj-tab.active-green  { color: var(--green); }
  .subj-tab.active-blue   { color: var(--blue); }
  .subj-tab.active-purple { color: var(--purple); }
  .subj-tab::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: transparent;
    transition: background 0.15s;
  }
  .subj-tab.active-green::after  { background: var(--green); }
  .subj-tab.active-blue::after   { background: var(--blue); }
  .subj-tab.active-purple::after { background: var(--purple); }

  .tab-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-green  { background: var(--green); }
  .dot-blue   { background: var(--blue); }
  .dot-purple { background: var(--purple); }

  /* Chapter pills inside tab */
  .tab-count {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 99px;
    border: 1px solid var(--border2);
    color: var(--text3);
  }
  .subj-tab.active-green  .tab-count { border-color: #1a4d2e; color: var(--green); }
  .subj-tab.active-blue   .tab-count { border-color: #1a2e4d; color: var(--blue); }
  .subj-tab.active-purple .tab-count { border-color: #3d1a5e; color: var(--purple); }

  /* ── Chapter list (shown when subject selected but no chapter) ── */
  .chapter-list {
    width: 100%;
    max-width: 600px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chapter-list-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }
  .chap-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    text-decoration: none;
    color: inherit;
    gap: 12px;
  }
  .chap-card:hover { background: var(--surface2); transform: translateY(-1px); }
  .chap-card.green:hover  { border-color: #1a4d2e; }
  .chap-card.blue:hover   { border-color: #1a2e4d; }
  .chap-card.purple:hover { border-color: #3d1a5e; }

  .chap-left { display: flex; flex-direction: column; gap: 3px; }
  .chap-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .chap-tag.green  { color: var(--green); }
  .chap-tag.blue   { color: var(--blue); }
  .chap-tag.purple { color: var(--purple); }
  .chap-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .chap-sub   { font-size: 12px; color: var(--text3); }

  .chap-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 99px;
    border: 1px solid var(--border2);
    color: var(--text3);
  }
  .chap-arrow { font-size: 16px; color: var(--text3); transition: color 0.15s, transform 0.15s; }
  .chap-card:hover .chap-arrow { transform: translateX(3px); }
  .chap-card.green:hover  .chap-arrow { color: var(--green); }
  .chap-card.blue:hover   .chap-arrow { color: var(--blue); }
  .chap-card.purple:hover .chap-arrow { color: var(--purple); }

  /* ── Quiz area ── */
  .quiz-container {
    width: 100%;
    max-width: 600px;
    padding: 1.75rem 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Back breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text3);
  }
  .breadcrumb button {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
    padding: 0; transition: color 0.15s;
  }
  .breadcrumb button:hover { color: var(--text); }
  .breadcrumb .sep { color: var(--border2); }
  .breadcrumb .current { color: var(--text2); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .stat-num { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .stat-lbl { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }

  .progress-bg { height: 3px; background: var(--border); border-radius: 99px; }
  .progress-fill { height: 3px; border-radius: 99px; transition: width 0.35s ease; }
  .progress-fill.green { background: var(--green); }
  .progress-fill.blue  { background: var(--blue); }

  .quiz-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .qtab {
    padding: 6px 13px; border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text2);
    font-size: 12px; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: all 0.15s;
  }
  .qtab:hover { border-color: var(--border2); color: var(--text); }
  .qtab.active-green  { background: var(--surface2); border-color: var(--green);  color: var(--green);  font-weight: 500; }
  .qtab.active-blue   { background: var(--surface2); border-color: var(--blue);   color: var(--blue);   font-weight: 500; }
  .qtab.active-purple { background: var(--surface2); border-color: var(--purple); color: var(--purple); font-weight: 500; }
  .qtab-sep { width: 1px; background: var(--border); margin: 0 2px; align-self: stretch; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 2.5rem 2rem; min-height: 170px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
  }
  .card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .card-unit { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .card-question { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .card-hint { font-size: 12px; color: var(--text3); margin-top: 8px; }
  .card-answer { font-size: 20px; font-weight: 500; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); width: 100%; animation: fi .2s ease; }
  .card-answer.green { color: var(--green); }
  .card-answer.blue  { color: var(--blue); }
  @keyframes fi { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 12px;
    font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); cursor: pointer; text-align: center; line-height: 1.4;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--border2); background: var(--surface2); }
  .opt.correct-green  { background: var(--green-dim);  border-color: var(--green);  color: var(--green); }
  .opt.correct-blue   { background: var(--blue-dim);   border-color: var(--blue);   color: var(--blue); }
  .opt.correct-purple { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }
  .opt.wrong  { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .opt:disabled { cursor: default; }

  .type-input {
    width: 100%; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 16px; font-family: 'Noto Sans KR', sans-serif;
    outline: none; transition: border-color .15s;
  }
  .type-input:disabled { opacity: .6; }
  .type-input.focus-green:focus  { border-color: var(--green); }
  .type-input.focus-blue:focus   { border-color: var(--blue); }
  .type-input.focus-purple:focus { border-color: var(--purple); }

  .feedback { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; text-align: center; animation: fi .2s ease; }
  .feedback.ok-green  { background: var(--green-dim);  color: var(--green);  border: 1px solid #1e5e34; }
  .feedback.ok-blue   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid #1e3a5e; }
  .feedback.ok-purple { background: var(--purple-dim); color: var(--purple); border: 1px solid #5e1e8e; }
  .feedback.ng { background: var(--red-dim); color: var(--red); border: 1px solid #5e1e1e; }

  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: transparent;
    color: var(--text2); font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: var(--surface2); color: var(--text); }
  .btn-green  { background: var(--green);  color: #0d0d0d; border-color: var(--green);  font-weight: 700; }
  .btn-green:hover  { background: #34d270; }
  .btn-blue   { background: var(--blue);   color: #0d0d0d; border-color: var(--blue);   font-weight: 700; }
  .btn-blue:hover   { background: #93c5fd; }
  .btn-purple { background: var(--purple); color: #0d0d0d; border-color: var(--purple); font-weight: 700; }
  .btn-purple:hover { background: #d8b4fe; }

  .flash-btns { display: flex; gap: 10px; }
  .flash-btns .btn { flex: 1; padding: 12px; }
  .btn-wrong   { border-color: var(--red);   color: var(--red); }
  .btn-wrong:hover { background: var(--red-dim); }
  .btn-correct-green  { border-color: var(--green);  color: var(--green); }
  .btn-correct-green:hover  { background: var(--green-dim); }
  .btn-correct-blue   { border-color: var(--blue);   color: var(--blue); }
  .btn-correct-blue:hover   { background: var(--blue-dim); }
  .btn-correct-purple { border-color: var(--purple); color: var(--purple); }
  .btn-correct-purple:hover { background: var(--purple-dim); }

  .result { text-align: center; padding: 3rem 1rem; }
  .result-score { font-family: 'Space Mono', monospace; font-size: 64px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
  .result-score.green  { color: var(--green); }
  .result-score.blue   { color: var(--blue); }
  .result-score.purple { color: var(--purple); }
  .result-sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; }
  .card-answer.green  { color: var(--green); }
  .card-answer.blue   { color: var(--blue); }
  .card-answer.purple { color: var(--purple); }

  .hidden { display: none; }

  @media (max-width: 480px) {
    .header-top { padding: 1rem 1.25rem 0; }
    .subject-tabs { padding: 0 1.25rem; }
    .card-question { font-size: 22px; }
    .options { grid-template-columns: 1fr; }
    .quiz-container { padding: 1.25rem 1rem; }
    .chapter-list { padding: 1.5rem 1rem; }
  }
</style>
</head>

  <div class="header-top">
    <span class="logo">Vocab Quiz</span>

    <button class="subj-tab active-green" id="tab-shimhwa" onclick="selectSubject('shimhwa')">
      <span class="tab-dot dot-green"></span>

  </div>
</header>

<div id="view-chapter" class="chapter-list"></div>
<div id="view-quiz" class="quiz-container hidden"></div>

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let appState = {
  subject: 'shimhwa',
  chapter: null,
  quiz: {
    mode: 'mc', dir: 'en2ko', filter: 'all',
    deck: [], idx: 0, score: 0, wrong: 0,
    flipped: false, answered: false, chosen: null,
    typed: '', feedback: null, done: false, opts: {}
  }
};

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
function selectSubject(subj) {
  appState.subject = subj;
  appState.chapter = null;
  const colorMap = { shimhwa: 'active-green', common: 'active-blue', final: 'active-purple' };
  ['shimhwa','common','final'].forEach(s => {
    const t = document.getElementById('tab-'+s);
    t.className = 'subj-tab';
    if (s === subj) t.className += ' ' + colorMap[s];
  });
  showChapterList();
}

function selectChapter(chapId) {
  const subj = SUBJECTS[appState.subject];
  appState.chapter = subj.chapters.find(c => c.id === chapId);
  buildDeck();
  showQuiz();
}

function backToChapters() {
  appState.chapter = null;
  showChapterList();
}

function showChapterList() {
  document.getElementById('view-quiz').classList.add('hidden');
  const el = document.getElementById('view-chapter');
  el.classList.remove('hidden');
  const subj = SUBJECTS[appState.subject];
  const c = subj.color;
  el.innerHTML = `
    <div class="chapter-list-title">${subj.label} — 단원 선택</div>

          <span class="chap-sub">${ch.sub}</span>

    `).join('')}`;
}

function showQuiz() {
  document.getElementById('view-chapter').classList.add('hidden');
  document.getElementById('view-quiz').classList.remove('hidden');
  renderQuiz();
}

/* ═══════════════════════════════════════════
   QUIZ LOGIC
═══════════════════════════════════════════ */
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function allWords() { return appState.chapter.words; }

function buildDeck() {
  const q = appState.quiz;
  let pool = allWords();
  if (q.filter === '5-1') pool = pool.filter(w => w.unit && w.unit.includes('5-1'));
  else if (q.filter === '5-2') pool = pool.filter(w => w.unit && w.unit.includes('5-2'));
  // For syn mode, only words that have synonyms
  if (q.mode === 'syn') pool = pool.filter(w => w.syn && w.syn.trim() !== '');
  q.deck = shuffle(pool);
  q.idx=0; q.score=0; q.wrong=0;
  q.flipped=false; q.answered=false; q.chosen=null;
  q.typed=''; q.feedback=null; q.done=false; q.opts={};
}

function getOpts(w, i) {
  const q = appState.quiz;
  if (q.opts[i]) return q.opts[i];
  let pool, getLabel;
  if (q.mode === 'syn') {
    // options = synonyms of other words (first synonym token)
    pool = allWords().filter(x => x !== w && x.syn && x.syn.trim() !== '');
    getLabel = x => x.syn.split(',')[0].trim();
    const correctLabel = w.syn.split(',')[0].trim();
    const wrongs = shuffle(pool).slice(0,3).map(getLabel);
    const o = shuffle([correctLabel, ...wrongs]);
    q.opts[i] = o; return o;
  }
  pool = allWords().filter(x => x !== w);
  const o = shuffle([w, ...shuffle(pool).slice(0,3)]);
  q.opts[i] = o; return o;
}

function nextCard() {
  const q = appState.quiz;
  if (q.idx+1 >= q.deck.length) { q.done=true; renderQuiz(); return; }
  q.idx++; q.flipped=false; q.answered=false;
  q.chosen=null; q.typed=''; q.feedback=null; renderQuiz();
}

function checkType() {
  const q = appState.quiz;
  if (q.answered) return;
  const w = q.deck[q.idx];
  const ans = q.dir==='en2ko' ? w.ko : w.en;
  const t = q.typed.trim().toLowerCase();
  const ok = ans.split(',').map(a=>a.trim().toLowerCase()).some(v=>t===v||t===v.replace(/\s/g,''));
  if (ok) { q.score++; q.feedback='ok'; } else { q.wrong++; q.feedback=ans; }
  q.answered=true; renderQuiz();
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function renderQuiz() {
  const app = document.getElementById('view-quiz');
  const q = appState.quiz;
  const ch = appState.chapter;
  const subj = SUBJECTS[appState.subject];
  const c = subj.color; // 'green' or 'blue'
  const accent = c === 'green' ? 'active-green' : 'active-blue';
  const hasSyn = allWords().some(w => w.syn && w.syn.trim() !== '');
  const hasFilter = ch.words.some(w => w.unit && (w.unit.includes('5-1') || w.unit.includes('5-2')));
  const total = q.deck.length;
  const pct = Math.round((q.idx/total)*100);

  if (q.done) {
    const t2 = q.score+q.wrong;
    const p = t2 ? Math.round((q.score/t2)*100) : 0;
    app.innerHTML = `
      <div class="breadcrumb">
        <button onclick="backToChapters()">← ${subj.label}</button>
        <span class="sep">/</span>
        <span class="current">${ch.title}</span>
      </div>
      <div class="result">
        <div class="result-score ${c}">${q.score}<span style="font-size:32px;color:var(--text3)">/${t2}</span></div>
        <div class="result-sub">정답률 ${p}% · ${total}개 완료</div>
        <div class="btn-row">
          <button class="btn" onclick="backToChapters()">목록으로</button>
          <button class="btn btn-${c}" onclick="restartQuiz()">다시 풀기</button>
        </div>
      </div>`;
    return;
  }

  const w = q.deck[q.idx];
  const ques = q.mode==='syn' ? w.en : (q.dir==='en2ko' ? w.en : w.ko);
  const ans  = q.mode==='syn' ? w.syn : (q.dir==='en2ko' ? w.ko : w.en);
  let body = '';

  if (q.mode==='flash') {
    const synInfo = w.syn ? `<div style="font-size:12px;color:var(--text3);margin-top:6px">${w.synLabel||'유의어'}: <span style="color:var(--${c})">${w.syn}</span></div>` : '';
    body = `
      <div class="card" onclick="flipCard()">
        ${w.unit ? `<div class="card-unit">${w.unit}</div>` : ''}
        <div class="card-question">${ques}</div>
        ${q.flipped
          ? `<div class="card-answer ${c}">${q.dir==='en2ko'?w.ko:w.en}</div>${synInfo}`
          : `<div class="card-hint">탭해서 뒤집기</div>`}
      </div>
      ${q.flipped ? `<div class="flash-btns">
        <button class="btn btn-wrong" onclick="markWrong()">✕ 몰랐어요</button>
        <button class="btn btn-correct-${c}" onclick="markCorrect()">✓ 알았어요</button>
      </div>` : ''}`;
  } else if (q.mode==='syn') {
    // synonym MC
    const opts = getOpts(w, q.idx);
    const correct = w.syn.split(',')[0].trim();
    body = `
      <div class="card" style="cursor:default">
        ${w.unit ? `<div class="card-unit">${w.unit} · 유의어</div>` : '<div class="card-unit">유의어</div>'}
        <div class="card-question">${w.en}</div>
        <div style="font-size:13px;color:var(--text3);margin-top:6px">${w.ko}</div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:4px;text-align:center">유의어(synonym)를 고르세요</div>
      <div class="options">
        ${opts.map((lbl,i) => {
          let cls = 'opt';
          if (q.answered) {
            if (lbl === correct) cls += ` correct-${c}`;
            else if (q.chosen === lbl) cls += ' wrong';
          }
          return `<button class="${cls}" onclick="chooseOpt(${i})" ${q.answered?'disabled':''}>${lbl}</button>`;
        }).join('')}
      </div>
      ${q.feedback==='ok' ? `<div class="feedback ok-${c}">✓ 정답!</div>` : q.feedback ? `<div class="feedback ng">정답: ${q.feedback}</div>` : ''}
      ${q.answered ? `<div class="btn-row"><button class="btn btn-${c}" onclick="nextCard()">다음 →</button></div>` : ''}`;
  } else if (q.mode==='mc') {
    const opts = getOpts(w, q.idx);
    body = `
      <div class="card" style="cursor:default">
        ${w.unit ? `<div class="card-unit">${w.unit}</div>` : ''}
        <div class="card-question">${ques}</div>
      </div>
      <div class="options">
        ${opts.map((o,i) => {
          const lbl = q.dir==='en2ko' ? o.ko : o.en;
          let cls = 'opt';
          if (q.answered) {
            if (o===w) cls += ` correct-${c}`;
            else if (q.chosen===o) cls += ' wrong';
          }
          return `<button class="${cls}" onclick="chooseOpt(${i})" ${q.answered?'disabled':''}>${lbl}</button>`;
        }).join('')}
      </div>
      ${q.feedback==='ok' ? `<div class="feedback ok-${c}">✓ 정답!</div>` : q.feedback ? `<div class="feedback ng">정답: ${q.feedback}</div>` : ''}
      ${q.answered ? `<div class="btn-row"><button class="btn btn-${c}" onclick="nextCard()">다음 →</button></div>` : ''}`;
  } else {
    body = `
      <div class="card" style="cursor:default">
        ${w.unit ? `<div class="card-unit">${w.unit}</div>` : ''}
        <div class="card-question">${ques}</div>
      </div>
      <input class="type-input focus-${c}" id="ti" type="text"
        placeholder="${q.dir==='en2ko'?'한국어 뜻 입력...':'영어 단어 입력...'}"
        oninput="appState.quiz.typed=this.value"
        onkeydown="if(event.key==='Enter'&&!appState.quiz.answered)checkType()"
        ${q.answered?'disabled':''}/>
      ${q.feedback==='ok' ? `<div class="feedback ok-${c}">✓ 정답!</div>` : q.feedback ? `<div class="feedback ng">정답: ${q.feedback}</div>` : ''}
      ${!q.answered
        ? `<div class="btn-row"><button class="btn btn-${c}" onclick="checkType()">확인</button></div>`
        : `<div class="btn-row"><button class="btn btn-${c}" onclick="nextCard()">다음 →</button></div>`}`;
  }

  app.innerHTML = `
    <div class="breadcrumb">
      <button onclick="backToChapters()">← ${subj.label}</button>
      <span class="sep">/</span>
      <span class="current">${ch.title}</span>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-num">${q.idx}/${total}</div><div class="stat-lbl">진행</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--${c})">${q.score}</div><div class="stat-lbl">정답</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red)">${q.wrong}</div><div class="stat-lbl">오답</div></div>
    </div>
    <div class="progress-bg"><div class="progress-fill ${c}" style="width:${pct}%"></div></div>
    <div class="quiz-tabs">
      <button class="qtab ${q.mode==='flash'?accent:''}" onclick="setMode('flash')">플래시카드</button>
      <button class="qtab ${q.mode==='mc'?accent:''}"    onclick="setMode('mc')">객관식</button>
      <button class="qtab ${q.mode==='type'?accent:''}"  onclick="setMode('type')">직접 입력</button>
      ${hasSyn ? `<button class="qtab ${q.mode==='syn'?accent:''}" onclick="setMode('syn')">유의어</button>` : ''}
      <div class="qtab-sep"></div>
      ${q.mode !== 'syn' ? `
      <button class="qtab ${q.dir==='en2ko'?accent:''}" onclick="setDir('en2ko')">영→한</button>
      <button class="qtab ${q.dir==='ko2en'?accent:''}" onclick="setDir('ko2en')">한→영</button>` : ''}
      ${hasFilter ? `<div class="qtab-sep"></div>
      <button class="qtab ${q.filter==='all'?accent:''}"  onclick="setFilter('all')">전체</button>
      <button class="qtab ${q.filter==='5-1'?accent:''}"  onclick="setFilter('5-1')">5-1단원</button>
      <button class="qtab ${q.filter==='5-2'?accent:''}"  onclick="setFilter('5-2')">5-2단원</button>` : ''}
    </div>
    ${body}`;

  if (q.mode==='type' && !q.answered) {
    const ti = document.getElementById('ti');
    if (ti) { ti.value = q.typed; setTimeout(()=>ti.focus(), 30); }
  }
}

function flipCard()    { appState.quiz.flipped=!appState.quiz.flipped; renderQuiz(); }
function markCorrect() { appState.quiz.score++; nextCard(); }
function markWrong()   { appState.quiz.wrong++; nextCard(); }
function chooseOpt(i) {
  const q = appState.quiz;
  if (q.answered) return;
  const w = q.deck[q.idx];
  if (q.mode === 'syn') {
    const opts = getOpts(w, q.idx);
    const chosen = opts[i];
    const correct = w.syn.split(',')[0].trim();
    q.chosen = chosen; q.answered = true;
    if (chosen === correct) { q.score++; q.feedback='ok'; }
    else { q.wrong++; q.feedback = w.syn; }
  } else {
    const opts = getOpts(w, q.idx);
    q.chosen=opts[i]; q.answered=true;
    if (q.chosen===w) { q.score++; q.feedback='ok'; }
    else { q.wrong++; q.feedback=(q.dir==='en2ko'?w.ko:w.en); }
  }
  renderQuiz();
}
function setMode(m)   { appState.quiz.mode=m;   appState.quiz.opts={}; buildDeck(); renderQuiz(); }
function setDir(d)    { appState.quiz.dir=d;    appState.quiz.opts={}; buildDeck(); renderQuiz(); }
function setFilter(f) { appState.quiz.filter=f; appState.quiz.opts={}; buildDeck(); renderQuiz(); }
function restartQuiz(){ appState.quiz.opts={}; buildDeck(); renderQuiz(); }

/* ── update tab counts ── */
function updateCounts() {
  document.getElementById('count-shimhwa').textContent = SUBJECTS.shimhwa.chapters.length + '단원';
  document.getElementById('count-common').textContent  = SUBJECTS.common.chapters.length  + '단원';
  document.getElementById('count-final').textContent   = SUBJECTS.final.chapters.length   + '단원';
}

/* ── init ── */
updateCounts();
showChapterList();
