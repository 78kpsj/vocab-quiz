<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공통영어 단어 퀴즈 — 5단원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #383838;
    --text: #f0ede8;
    --text2: #8a8680;
    --text3: #555250;
    --green: #4ade80;
    --green-dim: #1a3d27;
    --red: #f87171;
    --red-dim: #3d1a1a;
    --accent: #4ade80;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  header span { font-size: 12px; color: var(--text3); }

  .container {
    width: 100%;
    max-width: 600px;
    padding: 2rem 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-lbl { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; }

  .progress-bg { height: 3px; background: var(--border); border-radius: 99px; }
  .progress-fill {
    height: 3px;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.35s ease;
  }

  .tabs-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 6px 13px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }
  .tab-sep { width: 1px; background: var(--border); margin: 0 2px; align-self: stretch; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
  }
  .card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .card-question {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .card-hint { font-size: 12px; color: var(--text3); margin-top: 8px; }
  .card-answer {
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    width: 100%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .opt {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--border2); background: var(--surface2); }
  .opt.correct { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .opt.wrong { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .opt:disabled { cursor: default; }

  .type-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  .type-input:focus { border-color: var(--accent); }
  .type-input:disabled { opacity: 0.6; }

  .feedback {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    text-align: center;
    animation: fadeIn 0.2s ease;
  }
  .feedback.ok { background: var(--green-dim); color: var(--green); border: 1px solid #1e5e34; }
  .feedback.ng { background: var(--red-dim); color: var(--red); border: 1px solid #5e1e1e; }

  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--surface2); color: var(--text); }
  .btn-primary { background: var(--accent); color: #0d0d0d; border-color: var(--accent); font-weight: 700; }
  .btn-primary:hover { background: #34d270; border-color: #34d270; }

  .flash-btns { display: flex; gap: 10px; }
  .flash-btns .btn { flex: 1; padding: 12px; }
  .btn-wrong { border-color: var(--red); color: var(--red); }
  .btn-wrong:hover { background: var(--red-dim); }
  .btn-correct { border-color: var(--green); color: var(--green); }
  .btn-correct:hover { background: var(--green-dim); }

  .result { text-align: center; padding: 3rem 1rem; }
  .result-score {
    font-family: 'Space Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; }

  @media (max-width: 480px) {
    .card-question { font-size: 22px; }
    .options { grid-template-columns: 1fr; }
    header { padding: 1rem 1.25rem; }
    .container { padding: 1.25rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Vocab Quiz</h1>
  <span>공통영어 5단원</span>
</header>

<div class="container" id="app"></div>

<script>
const WORDS = [
  {en:"Helpings", ko:"음식, 음식을 덜다"},
  {en:"Buffet", ko:"뷔페"},
  {en:"Ache", ko:"아프다, 쑤시다"},
  {en:"Immensely", ko:"엄청나게"},
  {en:"Thrilled", ko:"신이 난"},
  {en:"Consumed", ko:"먹어치운, 섭취한"},
  {en:"Accumulated", ko:"쌓아 모은, 축적한"},
  {en:"Gathered up", ko:"잔뜩 챙긴"},
  {en:"No secret", ko:"다들 아는 사실"},
  {en:"You bet!", ko:"당연하지!, 물론이죠!"},
  {en:"Irresistible", ko:"거부할 수 없는"},
  {en:"Connoisseur", ko:"감정가, 전문가"},
  {en:"Cranks out", ko:"대량으로 찍어내다"},
  {en:"A great deal of", ko:"상당한, 많은"},
  {en:"Flip", ko:"완전히 뒤바꾸다"},
  {en:"Upside and a downside", ko:"장점과 단점"},
  {en:"Intrinsically", ko:"본질적으로"},
  {en:"Allure", ko:"매력, 유혹"},
  {en:"Tied to", ko:"~와 연결된, ~에 달려있는"},
  {en:"Suppose", ko:"가정해보다, ~라고 치자"},
  {en:"Computation", ko:"계산"},
  {en:"Hardwired", ko:"타고난, 본능적으로 새겨진"},
  {en:"Implications", ko:"영향, 시사점"},
  {en:"Exception", ko:"예외"},
  {en:"Spell", ko:"마법, 주문"},
  {en:"Status quo", ko:"현상 유지"},
  {en:"Start a stampede", ko:"폭발적인 반응을 일으키다"},
  {en:"Marvelous", ko:"놀라운, 대단한"},
  {en:"Inspection", ko:"검사, 점검"},
  {en:"Eliminate", ko:"없애다, 완전히 제거하다"},
  {en:"Registration", ko:"등록비"},
  {en:"An ace in their hand", ko:"강력한 패, 비장의 무기"},
  {en:"Let alone", ko:"~은커녕"},
  {en:"Counterintuitive", ko:"직관에 반하는, 상식과 반대되는"},
  {en:"Cutbacks", ko:"예산 삭감"},
];

let state = {
  mode: 'mc',
  dir: 'en2ko',
  deck: [],
  idx: 0,
  score: 0,
  wrong: 0,
  flipped: false,
  answered: false,
  chosen: null,
  typed: '',
  feedback: null,
  done: false,
  opts: {},
};

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function buildDeck() {
  state.deck = shuffle(WORDS);
  state.idx = 0; state.score = 0; state.wrong = 0;
  state.flipped = false; state.answered = false; state.chosen = null;
  state.typed = ''; state.feedback = null; state.done = false; state.opts = {};
}

function cur() { return state.deck[state.idx]; }

function getOpts(w, i) {
  if (state.opts[i]) return state.opts[i];
  const pool = WORDS.filter(x => x !== w);
  const o = shuffle([w, ...shuffle(pool).slice(0, 3)]);
  state.opts[i] = o; return o;
}

function nextCard() {
  if (state.idx + 1 >= state.deck.length) { state.done = true; render(); return; }
  state.idx++; state.flipped = false; state.answered = false;
  state.chosen = null; state.typed = ''; state.feedback = null;
  render();
}

function checkType() {
  if (state.answered) return;
  const w = cur();
  const ans = state.dir === 'en2ko' ? w.ko : w.en;
  const t = state.typed.trim().toLowerCase();
  const variants = ans.split(',').map(a => a.trim().toLowerCase());
  const ok = variants.some(v => t === v || t === v.replace(/\s/g, ''));
  if (ok) { state.score++; state.feedback = 'ok'; }
  else { state.wrong++; state.feedback = ans; }
  state.answered = true; render();
}

function render() {
  const app = document.getElementById('app');
  if (!state.deck.length) buildDeck();
  const total = state.deck.length;
  const pct = Math.round((state.idx / total) * 100);

  if (state.done) {
    const t2 = state.score + state.wrong;
    const p = t2 ? Math.round((state.score / t2) * 100) : 0;
    app.innerHTML = `
      <div class="result">
        <div class="result-score">${state.score}<span style="font-size:32px;color:var(--text3)">/${t2}</span></div>
        <div class="result-sub">정답률 ${p}% · ${total}개 완료</div>
        <div class="btn-row"><button class="btn btn-primary" onclick="restart()">다시 풀기</button></div>
      </div>`;
    return;
  }

  const w = cur();
  const q = state.dir === 'en2ko' ? w.en : w.ko;
  const a = state.dir === 'en2ko' ? w.ko : w.en;
  let body = '';

  if (state.mode === 'flash') {
    body = `
      <div class="card" onclick="flipCard()">
        <div class="card-question">${q}</div>
        ${state.flipped ? `<div class="card-answer">${a}</div>` : `<div class="card-hint">탭해서 뒤집기</div>`}
      </div>
      ${state.flipped ? `
      <div class="flash-btns">
        <button class="btn btn-wrong" onclick="markWrong()">✕ 몰랐어요</button>
        <button class="btn btn-correct" onclick="markCorrect()">✓ 알았어요</button>
      </div>` : ''}`;
  } else if (state.mode === 'mc') {
    const opts = getOpts(w, state.idx);
    body = `
      <div class="card" style="cursor:default">
        <div class="card-question">${q}</div>
      </div>
      <div class="options">
        ${opts.map((o, i) => {
          const lbl = state.dir === 'en2ko' ? o.ko : o.en;
          let cls = 'opt';
          if (state.answered) {
            if (o === w) cls += ' correct';
            else if (state.chosen === o) cls += ' wrong';
          }
          return `<button class="${cls}" onclick="chooseOpt(${i})" ${state.answered ? 'disabled' : ''}>${lbl}</button>`;
        }).join('')}
      </div>
      ${state.feedback === 'ok' ? `<div class="feedback ok">✓ 정답!</div>`
        : state.feedback ? `<div class="feedback ng">정답: ${state.feedback}</div>` : ''}
      ${state.answered ? `<div class="btn-row"><button class="btn btn-primary" onclick="nextCard()">다음 →</button></div>` : ''}`;
  } else {
    body = `
      <div class="card" style="cursor:default">
        <div class="card-question">${q}</div>
      </div>
      <input class="type-input" id="ti" type="text"
        placeholder="${state.dir === 'en2ko' ? '한국어 뜻 입력...' : '영어 단어 입력...'}"
        oninput="state.typed=this.value"
        onkeydown="if(event.key==='Enter'&&!state.answered)checkType()"
        ${state.answered ? 'disabled' : ''} />
      ${state.feedback === 'ok' ? `<div class="feedback ok">✓ 정답!</div>`
        : state.feedback ? `<div class="feedback ng">정답: ${state.feedback}</div>` : ''}
      ${!state.answered
        ? `<div class="btn-row"><button class="btn btn-primary" onclick="checkType()">확인</button></div>`
        : `<div class="btn-row"><button class="btn btn-primary" onclick="nextCard()">다음 →</button></div>`}`;
  }

  app.innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="stat-num">${state.idx}/${total}</div><div class="stat-lbl">진행</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)">${state.score}</div><div class="stat-lbl">정답</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red)">${state.wrong}</div><div class="stat-lbl">오답</div></div>
    </div>
    <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="tabs-row">
      <button class="tab ${state.mode === 'flash' ? 'active' : ''}" onclick="setMode('flash')">플래시카드</button>
      <button class="tab ${state.mode === 'mc' ? 'active' : ''}" onclick="setMode('mc')">객관식</button>
      <button class="tab ${state.mode === 'type' ? 'active' : ''}" onclick="setMode('type')">직접 입력</button>
      <div class="tab-sep"></div>
      <button class="tab ${state.dir === 'en2ko' ? 'active' : ''}" onclick="setDir('en2ko')">영→한</button>
      <button class="tab ${state.dir === 'ko2en' ? 'active' : ''}" onclick="setDir('ko2en')">한→영</button>
    </div>
    ${body}`;

  if (state.mode === 'type' && !state.answered) {
    const ti = document.getElementById('ti');
    if (ti) { ti.value = state.typed; setTimeout(() => ti.focus(), 30); }
  }
}

function flipCard() { state.flipped = !state.flipped; render(); }
function markCorrect() { state.score++; nextCard(); }
function markWrong() { state.wrong++; nextCard(); }
function chooseOpt(i) {
  if (state.answered) return;
  const opts = getOpts(cur(), state.idx);
  state.chosen = opts[i]; state.answered = true;
  if (state.chosen === cur()) { state.score++; state.feedback = 'ok'; }
  else { state.wrong++; state.feedback = (state.dir === 'en2ko' ? cur().ko : cur().en); }
  render();
}
function setMode(m) { state.mode = m; state.opts = {}; buildDeck(); render(); }
function setDir(d) { state.dir = d; state.opts = {}; buildDeck(); render(); }
function restart() { state.opts = {}; buildDeck(); render(); }

buildDeck();
render();
</script>
</body>
</html>
