<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>대전외고 영단어 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(0,0,0,0); }
/* iOS Safari: make clickable divs work */
[onclick], .tab, .opt, .mode-btn, .sub-btn, .next-btn, .r-btn { cursor: pointer; }

:root {
  --bg: #0d0d14;
  --surf: #16161f;
  --surf2: #1e1e2e;
  --c1: #7c5cfc;
  --c2: #fc5c7d;
  --c3: #5c9dfc;
  --c4: #fcb85c;
  --ok: #5cf4a0;
  --ng: #fc5c7d;
  --tx: #e8e8f0;
  --txd: #7777aa;
  --br: #2a2a3e;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

.wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

/* ── HEADER ── */
header { text-align: center; padding: 24px 0 20px; }
.tag {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  color: var(--c1); border: 1px solid var(--c1);
  padding: 3px 10px; margin-bottom: 10px;
  text-transform: uppercase; border-radius: 2px;
}
header h1 { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
header h1 b { color: var(--c1); }
header p { color: var(--txd); font-size: 12px; }

/* ── DAY TABS ── */
.tabs { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin: 16px 0; }
.tab {
  padding: 10px 4px;
  background: var(--surf); border: 1px solid var(--br);
  border-radius: 10px; cursor: pointer;
  text-align: center;
  /* NO CSS variable inheritance — use inline style instead */
  transition: background 0.2s, border-color 0.2s;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.tab.on { background: var(--surf2); }
.tab-num { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; margin-bottom: 3px; }
.tab-title { font-size: 10px; font-weight: 700; line-height: 1.3; margin-bottom: 2px; }
.tab-cnt { font-size: 10px; }

/* ── SCORES ── */
.scores { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.sc {
  background: var(--surf); border: 1px solid var(--br);
  border-radius: 10px; padding: 10px 8px; text-align: center;
}
.sc-n { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; }
.sc-l { font-size: 10px; color: var(--txd); margin-top: 2px; }
.sc.ok .sc-n { color: var(--ok); }
.sc.ng .sc-n { color: var(--ng); }
.sc.re .sc-n { color: var(--c1); }

/* ── PROGRESS ── */
.prog-wrap { background: var(--surf); border-radius: 3px; height: 5px; margin-bottom: 14px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 3px; transition: width 0.35s; }

/* ── MODE TOGGLE ── */
.mode-row { display: flex; background: var(--surf); border: 1px solid var(--br); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.mode-btn {
  flex: 1; padding: 12px 6px;
  border: none; background: transparent;
  color: var(--txd); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
  touch-action: manipulation;
  -webkit-appearance: none;
}
.mode-btn.on { background: var(--surf2); color: var(--tx); font-weight: 700; }

/* ── QUIZ CARD ── */
.qcard {
  background: var(--surf); border: 2px solid var(--br);
  border-radius: 16px; padding: 28px 20px;
  margin-bottom: 12px;
  min-height: 140px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  position: relative;
  transition: border-color 0.2s, background 0.2s;
}
.qcard.flash-ok { border-color: var(--ok); background: rgba(92,244,160,0.07); }
.qcard.flash-ng { border-color: var(--ng); background: rgba(252,92,125,0.07); }
.q-num { position: absolute; top: 12px; right: 14px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--txd); }
.q-lbl { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; color: var(--txd); margin-bottom: 10px; text-transform: uppercase; }
.q-word { font-size: 26px; font-size: clamp(20px, 6vw, 32px); font-weight: 900; line-height: 1.3; word-break: keep-all; }

/* ── OPTIONS ── */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.opt {
  padding: 16px 10px;
  background: var(--surf); border: 1px solid var(--br);
  border-radius: 12px; color: var(--tx);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; line-height: 1.4;
  cursor: pointer; text-align: left;
  transition: border-color 0.15s, background 0.15s;
  touch-action: manipulation; -webkit-appearance: none;
  min-height: 56px;
  word-break: keep-all;
}
.opt:active:not(:disabled) { background: var(--surf2); }
.opt.ans-ok { border-color: var(--ok) !important; background: rgba(92,244,160,0.12) !important; color: var(--ok); font-weight: 700; }
.opt.ans-ng { border-color: var(--ng) !important; background: rgba(252,92,125,0.12) !important; color: var(--ng); }
.opt:disabled { cursor: default; }

/* ── INPUT MODE ── */
.inp-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
.ans-inp {
  flex: 1; padding: 14px 14px;
  background: var(--surf); border: 1px solid var(--br);
  border-radius: 12px; color: var(--tx);
  -webkit-text-fill-color: var(--tx);
  font-family: 'Noto Sans KR', sans-serif; font-size: 16px;
  outline: none; transition: border-color 0.2s;
  -webkit-appearance: none; appearance: none;
  border-radius: 12px; /* iOS rounds inputs by default, force our radius */
}
.ans-inp:focus { border-color: var(--c1); }
.ans-inp:disabled { opacity: 1; -webkit-text-fill-color: var(--tx); }
.ans-inp.inp-ok { border-color: var(--ok); background: rgba(92,244,160,0.08); -webkit-text-fill-color: var(--ok); }
.ans-inp.inp-ng { border-color: var(--ng); background: rgba(252,92,125,0.08); -webkit-text-fill-color: var(--ng); }

.sub-btn {
  padding: 14px 18px;
  background: var(--c1); border: none; border-radius: 12px;
  color: #fff; font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
  touch-action: manipulation; -webkit-appearance: none;
  white-space: nowrap;
}
.sub-btn:active { opacity: 0.8; }

/* ── FEEDBACK ── */
.fb { display: none; text-align: center; padding: 11px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 10px; word-break: keep-all; }
.fb.show { display: block; }
.fb.fb-ok { background: rgba(92,244,160,0.1); color: var(--ok); border: 1px solid rgba(92,244,160,0.3); }
.fb.fb-ng { background: rgba(252,92,125,0.1); color: var(--ng); border: 1px solid rgba(252,92,125,0.3); }

/* ── NEXT BUTTON ── */
.next-btn {
  display: none; width: 100%; padding: 16px;
  background: var(--surf2); border: 1px solid var(--br);
  border-radius: 12px; color: var(--tx);
  font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-bottom: 12px;
  touch-action: manipulation; -webkit-appearance: none;
}
.next-btn:active { border-color: var(--c1); }

/* ── RESULT ── */
.result { display: none; text-align: center; padding: 36px 20px; background: var(--surf); border: 1px solid var(--br); border-radius: 16px; margin-bottom: 16px; }
.result.show { display: block; }
.r-emoji { font-size: 50px; margin-bottom: 12px; }
.r-score { font-family: 'Space Mono', monospace; font-size: 42px; font-weight: 700; color: var(--c1); margin-bottom: 6px; }
.r-msg { color: var(--txd); font-size: 13px; margin-bottom: 20px; }
.r-btn {
  display: inline-block; padding: 13px 24px; margin: 5px;
  background: var(--c1); border: none; border-radius: 12px;
  color: #fff; font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
  touch-action: manipulation; -webkit-appearance: none;
}
.r-btn:active { opacity: 0.8; }
.r-btn.sec { background: var(--surf2); color: var(--tx); border: 1px solid var(--br); }

.wl { margin-top: 20px; text-align: left; }
.wl h3 { font-size: 12px; color: var(--ng); margin-bottom: 8px; }
.wi { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--surf2); border-radius: 8px; margin-bottom: 5px; font-size: 12px; }
.wi-en { font-weight: 700; }
.wi-kr { color: var(--txd); text-align: right; }

/* ── SWIPE HINT ── */
.swipe-hint { text-align: center; color: var(--txd); font-size: 11px; margin-bottom: 8px; }
</style>
</head>

    <div class="r-score" id="rScore">0/0</div>
    <div class="r-msg" id="rMsg"></div>
    <button class="r-btn" id="btnRestart" onclick="restart()">🔄 다시 풀기</button>
    <button class="r-btn sec" id="btnRetry" onclick="retryWrong()">✗ 틀린 것만</button>
    <div class="wl" id="wl"></div>
  </div>
</div>

// STATE
// ============================================================
let curDayIdx = 0, mode = 'c';
let qs = [], qi = 0, nOk = 0, nNg = 0, wrongs = [], done = false;

function rnd(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ── Build tabs
function buildTabs() {
  const c = document.getElementById('tabs');
  DAYS.forEach((d, i) => {
    const t = document.createElement('div');
    t.className = 'tab' + (i===0?' on':'');
    t.innerHTML = `<div class="tab-num" style="color:${d.color}">${d.label.toUpperCase()}</div>
      <div class="tab-title">${d.title}</div>
      <div class="tab-cnt" style="color:${d.color}">${d.words.length}개</div>`;
    // border color on active
    if (i===0) t.style.borderColor = d.color;
    t.addEventListener('click', () => startDay(i));
    c.appendChild(t);
  });
}

function startDay(idx) {
  curDayIdx = idx;
  const d = DAYS[idx];
  qs = rnd(d.words);
  qi = nOk = nNg = 0; wrongs = []; done = false;
  // update tab styles
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('on', i === idx);
    t.style.borderColor = (i === idx) ? DAYS[i].color : '';
  });
  document.getElementById('result').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  updateScores(); updateProg();
  renderQ();
}

function setMode(m) {
  mode = m;
  document.getElementById('btnC').classList.toggle('on', m==='c');
  document.getElementById('btnI').classList.toggle('on', m==='i');
  document.getElementById('opts').style.display = m==='c' ? '' : 'none';
  document.getElementById('inpWrap').style.display = m==='i' ? '' : 'none';
  startDay(curDayIdx);
}

function renderQ() {
  done = false;
  const fb = document.getElementById('fb');
  fb.className = 'fb';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('swipeHint').style.display = '';
  const card = document.getElementById('qcard');
  card.className = 'qcard';

  if (qi >= qs.length) { showResult(); return; }

  const q = qs[qi];
  const showEn = Math.random() > 0.4;
  const qWord = showEn ? q.en : q.kr;
  const ans = showEn ? q.kr : q.en;
  card.dataset.ans = ans;

  document.getElementById('qnum').textContent = `${qi+1} / ${qs.length}`;
  document.getElementById('qlbl').textContent = showEn ? '영어 → 한국어' : '한국어 → 영어';
  document.getElementById('qword').textContent = qWord;

  if (mode === 'c') buildOpts(q, showEn, ans);
  else {
    const inp = document.getElementById('inp');
    inp.value = ''; inp.className = 'ans-inp'; inp.disabled = false;
    inp.placeholder = showEn ? '한국어 뜻을 입력하세요...' : '영어 단어를 입력하세요...';
    // Don't auto-focus on mobile — keyboard pops up unexpectedly
  }
}

function buildOpts(q, showEn, ans) {
  const pool = DAYS[curDayIdx].words.filter(w => w !== q);
  const wrong3 = rnd(pool).slice(0,3).map(w => showEn ? w.kr : w.en);
  const opts = rnd([ans, ...wrong3]);
  const g = document.getElementById('opts');
  g.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = o;
    btn.addEventListener('click', () => pickOpt(btn, o, ans));
    g.appendChild(btn);
  });
}

function pickOpt(btn, sel, ans) {
  if (done) return;
  done = true;
  const ok = sel === ans;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === ans) b.classList.add('ans-ok');
  });
  if (!ok) btn.classList.add('ans-ng');
  handleResult(ok, ans);
}

function doSubmit() {
  if (done) { doNext(); return; }
  const inp = document.getElementById('inp');
  const v = inp.value.trim();
  if (!v) return;
  const ans = document.getElementById('qcard').dataset.ans;
  const norm = s => s.replace(/[~\s\[\]()·,\.\-]/g,'').toLowerCase();
  const ok = norm(v) === norm(ans) || ans.split(',').some(p => norm(v) === norm(p.trim()));
  inp.className = 'ans-inp ' + (ok ? 'inp-ok' : 'inp-ng');
  inp.disabled = true;
  handleResult(ok, ans);
}

function handleResult(ok, ans) {
  done = true;
  const fb = document.getElementById('fb');
  const card = document.getElementById('qcard');
  if (ok) {
    nOk++;
    fb.textContent = '✓ 정답!';
    fb.className = 'fb show fb-ok';
    card.className = 'qcard flash-ok';
  } else {
    nNg++;
    fb.textContent = `✗ 오답! 정답: ${ans}`;
    fb.className = 'fb show fb-ng';
    card.className = 'qcard flash-ng';
    wrongs.push(qs[qi]);
  }
  updateScores(); updateProg();
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('swipeHint').style.display = 'none';
}

function doNext() { qi++; renderQ(); }

function updateScores() {
  document.getElementById('sOk').textContent = nOk;
  document.getElementById('sNg').textContent = nNg;
  document.getElementById('sRe').textContent = Math.max(0, qs.length - qi);
}
function updateProg() {
  document.getElementById('prog').style.width = (qs.length ? qi/qs.length*100 : 0) + '%';
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('result').classList.add('show');
  const tot = qs.length, pct = Math.round(nOk/tot*100);
  document.getElementById('rScore').textContent = `${nOk}/${tot}`;
  let e='😅', m='더 열심히 해봐요!';
  if (pct>=90){e='🏆';m='완벽해요! 최고의 실력!';}
  else if (pct>=70){e='🎉';m='잘 했어요! 조금만 더!';}
  else if (pct>=50){e='💪';m='반은 맞췄어요, 화이팅!';}
  document.getElementById('rEmoji').textContent = e;
  document.getElementById('rMsg').textContent = `${pct}점 · ${m}`;
  const wl = document.getElementById('wl');
  wl.innerHTML = wrongs.length
    ? `<h3>✗ 틀린 단어 (${wrongs.length}개)</h3>`
      + wrongs.map(w=>`<div class="wi"><span class="wi-en">${w.en}</span><span class="wi-kr">${w.kr}</span></div>`).join('')
    : '';
  // scroll to top - iOS Safari compatible
  try { document.getElementById('result').scrollIntoView(true); } catch(e) { window.scrollTo(0,0); }
}

function restart() { startDay(curDayIdx); }
function retryWrong() {
  if (!wrongs.length) { restart(); return; }
  qs = rnd([...wrongs]);
  qi = nOk = nNg = 0; wrongs = []; done = false;
  updateScores(); updateProg();
  document.getElementById('result').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  renderQ();
}

// ── Swipe to next
(function() {
  let sx = 0, sy = 0;
  const area = document.getElementById('quizArea');
  area.addEventListener('touchstart', function(e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, {passive:true});
  area.addEventListener('touchend', function(e) {
    if (!done) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) doNext();
  }, {passive:true});
})();

// ── Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!done && mode==='i') doSubmit();
    else if (done) doNext();
  }
});

// ── Bind buttons directly (script is at end of body, DOM already loaded)
document.getElementById('btnC').addEventListener('click', function() { setMode('c'); });
document.getElementById('btnI').addEventListener('click', function() { setMode('i'); });
document.getElementById('btnSubmit').addEventListener('click', function() { doSubmit(); });
document.getElementById('nextBtn').addEventListener('click', function() { doNext(); });
document.getElementById('btnRestart').addEventListener('click', function() { restart(); });
document.getElementById('btnRetry').addEventListener('click', function() { retryWrong(); });
document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) doSubmit();
});

buildTabs();
startDay(0);
</script>
